<title>Medex Online Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F8FC; --sf:#FFFFFF; --sf2:#EEF4FB; --ink:#0B1F3A; --mu:#5B6B82; --ln:#DCE5F0;
  --sky:#2C86CF; --sky2:#E3F0FB; --am:#F26B1D; --amink:#FFFFFF;
  --ok:#16915F; --ok2:#DFF4EA; --wa:#B7790A; --wa2:#FBF0D8; --bd:#CC3C31; --bd2:#FBE3E0;
  --sd:#071429; --sdi:#CFDCEE; --sdm:#7189AA;
  --sh:0 1px 2px rgba(11,31,58,.05),0 14px 34px -20px rgba(11,31,58,.25);
  --rad:16px;
  --fd:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050E1C; --sf:#0B1A2F; --sf2:#10233D; --ink:#E6EEF9; --mu:#94A5BE; --ln:#1B2F4C;
  --sky:#5BB0EC; --sky2:#10294A; --am:#FF8A4C; --amink:#1A0B02;
  --ok:#3CC48D; --ok2:#0E3127; --wa:#E5AC3A; --wa2:#33270B; --bd:#F06B5F; --bd2:#3A1614;
  --sd:#020811; --sdi:#C9D6EA; --sdm:#5F7594;
  --sh:0 1px 2px rgba(0,0,0,.4),0 18px 44px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050E1C; --sf:#0B1A2F; --sf2:#10233D; --ink:#E6EEF9; --mu:#94A5BE; --ln:#1B2F4C;
  --sky:#5BB0EC; --sky2:#10294A; --am:#FF8A4C; --amink:#1A0B02;
  --ok:#3CC48D; --ok2:#0E3127; --wa:#E5AC3A; --wa2:#33270B; --bd:#F06B5F; --bd2:#3A1614;
  --sd:#020811; --sdi:#C9D6EA; --sdm:#5F7594;
  --sh:0 1px 2px rgba(0,0,0,.4),0 18px 44px -18px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.08;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
.sm{font-size:13px}
.eyebrow{font-family:var(--fm);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.ic{flex:none;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--sky)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-am{background:var(--am);color:var(--amink);border-color:transparent}
.btn-am::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.btn-ghost{background:transparent}
.btn-dark{background:transparent;color:var(--sdi);border-color:rgba(255,255,255,.14)}
.btn-dark:hover{border-color:var(--sky);color:#fff}
.btn-sm{height:34px;padding:0 13px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.icbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--ln);background:var(--sf);color:var(--ink);transition:border-color .2s}
.icbtn:hover{border-color:var(--sky)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:13px;font-weight:500;color:var(--mu);transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--sky)}

.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mu);min-width:0}
.inp,.sel{height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);width:100%;transition:border-color .2s,box-shadow .2s;font-weight:500;color:var(--ink)}
textarea.inp{height:auto;padding:10px 13px;min-height:72px;resize:vertical}
.inp:focus,.sel:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky2)}
.err{color:var(--bd);font-size:13px;font-weight:500;min-height:0}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;color:var(--ink);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--bd);flex:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln)}
.seg button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mu);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rad);box-shadow:var(--sh);padding:22px;min-width:0}
.card h3{font-size:22px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--fm);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok2);color:var(--ok)}
.t-warn{background:var(--wa2);color:var(--wa)}
.t-bad{background:var(--bd2);color:var(--bd)}
.t-info{background:var(--sky2);color:var(--sky)}
.t-mute{background:var(--sf2);color:var(--mu);border:1px solid var(--ln)}
.tag{font:500 10.5px/1 var(--fm);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:7px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.tag-am{background:var(--am);color:var(--amink)}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--ok));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.empty{padding:36px 20px;text-align:center;color:var(--mu);border:1.5px dashed var(--ln);border-radius:var(--rad)}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:12px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sf2)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:var(--sh);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:200;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
.mask{position:fixed;inset:0;background:rgba(3,10,22,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:150;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--sf);border-radius:20px;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,.8,.2,1) both;display:grid;gap:16px}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal h3{font-size:26px}

/* ---------- LANDING ---------- */
.lnav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--sf) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.lnav.sc{border-color:var(--ln)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.lnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--fd);letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.logo .ic{width:20px;height:20px}
.lnks{display:flex;gap:4px}
.lnks a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:var(--mu);transition:color .2s,background .2s}
.lnks a:hover{color:var(--ink);background:var(--sf2)}
.hero{position:relative;overflow:hidden;padding:72px 0 88px;background-image:radial-gradient(var(--ln) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:720px;height:720px;background:radial-gradient(circle,var(--sky2),transparent 65%);opacity:.9;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(-40px,30px)}}
.hero-g{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(50px,7.4vw,92px);font-weight:700;line-height:.92;text-transform:uppercase;margin:20px 0 18px}
.hero h1 em{font-style:normal;color:var(--sky)}
.hero h1 .wd{display:inline-block;animation:wd .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes wd{from{opacity:0;transform:translateY(38%) rotate(2deg)}}
.lead{font-size:17.5px;color:var(--mu);max-width:52ch}
.hcta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:44px;max-width:620px}
.stats div{border-left:2px solid var(--ln);padding-left:14px}
.stats b{display:block;font:600 40px/1 var(--fd);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--mu)}
.vis{position:relative;height:460px}
.vis svg.map{position:absolute;inset:0;width:100%;height:100%}
.vis .route{fill:none;stroke:var(--sky);stroke-width:1.6;stroke-dasharray:3 10;stroke-linecap:round;opacity:.6}
.vis .plane{fill:var(--ink)}
.float{position:absolute;background:var(--sf);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh);padding:16px 18px;min-width:220px;animation:bob 6s ease-in-out infinite}
.float.f1{top:36px;left:0}
.float.f2{bottom:30px;right:0;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-10px)}}
.float small{display:block;color:var(--mu);font-size:12px}
.float b{font:600 22px/1.1 var(--fd)}
.ticker{overflow:hidden;background:linear-gradient(90deg,#0B1F3A,#16406F,#0B1F3A);color:#EAF3FF;padding:16px 0;white-space:nowrap}
.ticker div{display:inline-flex;gap:40px;animation:tick 32s linear infinite;padding-left:40px}
.ticker span{font:600 18px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:14px;align-items:center}
.ticker span::after{content:"✈";color:var(--am)}
@keyframes tick{to{transform:translateX(-50%)}}
section.sec{padding:100px 0}
.sh{display:grid;gap:12px;max-width:660px;margin-bottom:44px}
.sh h2{font-size:clamp(38px,5vw,56px);font-weight:600}
.sh p{color:var(--mu);font-size:16px}
.lf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.svc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc{display:grid;gap:14px;align-content:start;padding:24px;border-radius:var(--rad);background:var(--sf);border:1px solid var(--ln);position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.svc:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--sky)}
.svc .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky2),color-mix(in srgb,var(--sky) 30%,var(--sf)));color:var(--sky);box-shadow:inset 0 0 0 1px var(--ln);transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.svc:hover .ico{transform:rotate(-12deg) scale(1.08)}
.svc h3{font-size:24px}
.svc p{color:var(--mu);font-size:14px}
.svc .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.cls-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cls{padding:28px;border-radius:22px;background:var(--sf);border:1px solid var(--ln);display:grid;gap:16px;align-content:start;box-shadow:var(--sh)}
.cls .n{font:700 96px/.8 var(--fd);color:var(--sky);letter-spacing:-.02em}
.cls h3{font-size:26px}
.cls ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px;color:var(--mu)}
.cls li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--am);margin-right:10px;vertical-align:middle}
.val{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ln);border-radius:12px;overflow:hidden;font:500 12px/1.3 var(--fm);text-align:center}
.val div{padding:10px 4px}
.val div+div{border-left:1px solid var(--ln)}
.val b{display:block;font:600 19px/1.2 var(--fd);color:var(--ink)}
.val small{color:var(--mu);font-size:10.5px}
.steps{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.steps::before{content:"";position:absolute;left:8%;right:8%;top:28px;height:2px;background:var(--ln)}
.steps .fill{position:absolute;left:8%;top:28px;height:2px;width:0;background:linear-gradient(90deg,var(--sky),var(--am));transition:width 2.2s cubic-bezier(.4,0,.2,1)}
.steps.in .fill{width:84%}
.stp{position:relative;display:grid;gap:12px;justify-items:center;text-align:center;padding:0 6px}
.stp .dt{width:58px;height:58px;border-radius:50%;background:var(--sf);border:2px solid var(--ln);display:grid;place-items:center;font:600 18px var(--fm);transition:border-color .5s,color .5s}
.steps.in .stp .dt{border-color:var(--sky);color:var(--sky)}
.stp h3{font:600 17px/1.25 var(--fb)}
.stp p{font-size:13.5px;color:var(--mu)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat .card{display:grid;gap:12px}
.feat .ico{width:44px;height:44px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;color:var(--ink)}
.faq{display:grid;gap:10px;max-width:820px}
.qa{border-radius:16px;background:var(--sf);border:1px solid var(--ln);overflow:hidden}
.qa>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 22px;font:600 16.5px/1.3 var(--fb);text-align:left}
.qa .pm{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sf2);position:relative;transition:transform .35s,background .35s}
.qa .pm::before,.qa .pm::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2px;background:var(--ink);transform:translate(-50%,-50%);border-radius:2px;transition:transform .35s}
.qa .pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.qa.open .pm{transform:rotate(180deg);background:var(--sky2)}
.qa.open .pm::after{transform:translate(-50%,-50%) rotate(0)}
.qa .an{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.qa.open .an{grid-template-rows:1fr}
.qa .an>div{overflow:hidden}
.qa .an p{padding:0 22px 20px;color:var(--mu);max-width:70ch}
.cta{background:linear-gradient(135deg,#0B1F3A,#16406F);color:#EAF3FF;border-radius:28px;padding:48px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(36px,4.6vw,52px);font-weight:600;position:relative}
.cta p{color:var(--sdi);position:relative;margin-top:10px}
.cta .btns{display:grid;gap:10px;position:relative}
.cinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.cinfo .card{display:grid;gap:6px}
footer.lf2{border-top:1px solid var(--ln);padding:34px 0 46px;color:var(--mu);font-size:13px}

/* ---------- LOGIN ---------- */
.lg{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.lg-l{background:linear-gradient(160deg,#0B1F3A,#071429);color:#EAF3FF;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-l h2{font-size:clamp(42px,5vw,64px);font-weight:600;line-height:1;position:relative}
.lg-l ul{display:grid;gap:12px;margin:0;padding:0;list-style:none;position:relative;color:var(--sdi)}
.lg-l li::before{content:"✈ ";color:var(--am)}
.lg-r{display:grid;place-items:center;padding:40px 24px;background:var(--bg)}
.lg-box{width:100%;max-width:420px;display:grid;gap:18px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.roles button{padding:11px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--mu);transition:background .25s,color .25s}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- STAFF APP ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--sd);color:var(--sdi);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{color:#fff;font-size:19px}
.side .logo{background:var(--sky);color:var(--sd)}
.side .sec-l{font:500 10.5px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--sdm);padding:0 12px;margin-bottom:-8px}
.snav{display:grid;gap:3px}
.snav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--sdm);font-weight:500;font-size:14.5px;text-align:left;transition:background .2s,color .2s}
.snav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.snav button[aria-current="page"]{color:#fff;background:rgba(91,176,236,.16);box-shadow:inset 3px 0 0 var(--sky)}
.snav .cnt{margin-left:auto;font:500 11.5px/1 var(--fm);background:var(--am);color:#1A0B02;padding:3px 7px;border-radius:999px}
.who{margin-top:auto;display:flex;gap:12px;align-items:center;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--ok));color:#fff;display:grid;place-items:center;font:600 14px var(--fm);flex:none}
.who b{display:block;color:#fff;font-size:14px}
.who small{color:var(--sdm);font-size:12px}
.who button{margin-left:auto;color:var(--sdm);padding:6px}
.who button:hover{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(18px,3vw,40px);border-bottom:1px solid var(--ln);background:var(--sf);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:34px}
.content{padding:clamp(18px,3vw,36px);display:grid;gap:18px;min-width:0}
.kpi{display:grid;gap:8px;position:relative;overflow:hidden}
.kpi b{font:600 46px/1 var(--fd);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mu)}
.kpi .ico{position:absolute;right:16px;top:16px;color:var(--sky);opacity:.5}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;min-width:0}
.bstack{width:100%;max-width:56px;flex:0 0 auto;min-height:4px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--sf2)}
.bstack i{display:block;width:100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.bcol small{font:500 11px/1 var(--fm);color:var(--mu);text-align:center}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mu);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.hrow{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center;font-size:14px;margin-bottom:12px}
.hrow span:last-child{text-align:right;font-family:var(--fm)}
.feed{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:10px 1fr;gap:12px;font-size:14px}
.feed li i{width:10px;height:10px;border-radius:50%;background:var(--sky);margin-top:6px}
.feed small{display:block;color:var(--mu);font:500 12px/1.4 var(--fm)}
.qlist{display:grid;gap:8px}
.qi{display:grid;gap:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);text-align:left;transition:border-color .2s,transform .2s,background .2s;width:100%}
.qi:hover{border-color:var(--sky);transform:translateX(3px)}
.qi[aria-current="true"]{border-color:var(--sky);background:var(--sky2)}
.qi .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qi small{color:var(--mu);font:500 12.5px/1.4 var(--fm)}
.ses-h{font:500 11px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:6px 2px 2px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.dcard{padding:16px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);display:grid;gap:10px}
.dcard .dd{font:600 40px/1 var(--fd)}
.dcard.full .bar i{background:var(--bd)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--ln);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.svc-c{display:grid;gap:12px;align-content:start}
.svc-c .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.svc-c p{color:var(--mu);font-size:13.5px}
.svc-c .meta{display:flex;gap:8px;flex-wrap:wrap}
.ex-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--sf2);color:var(--sky);flex:none}
.decg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.decg button{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);transition:border-color .2s,background .2s;display:grid;gap:4px}
.decg button:hover{border-color:var(--sky)}
.decg button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky2)}
.decg b{font:600 16px/1.2 var(--fb)}
.decg small{color:var(--mu);font-size:12.5px}

/* assessor station workspace */
.wk{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.stlist{display:grid;gap:6px;max-height:70vh;overflow:auto;padding-right:4px}
.stb{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);text-align:left;transition:border-color .2s,background .2s}
.stb:hover{border-color:var(--sky)}
.stb[aria-current="true"]{border-color:var(--sky);background:var(--sky2)}
.stb .ic-s{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--sf2);color:var(--sky)}
.stb b{font-weight:600;font-size:14px;display:block}
.stb small{font:500 11.5px/1.3 var(--fm);color:var(--mu)}
.frow{display:grid;grid-template-columns:1fr 1.2fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.frow:last-child{border-bottom:0}
.frow>span{font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.upbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1.5px dashed var(--ln);background:var(--sf2)}
.upthumb{width:120px;height:90px;border-radius:12px;background:var(--sf);display:grid;place-items:center;overflow:hidden;color:var(--sky)}
.upthumb img{width:100%;height:100%;object-fit:cover}
.imtbox{font:600 24px/1 var(--fd);padding-top:24px}
.sumlist{display:grid;gap:6px;font-size:14px}
.sumlist div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bd2)}
.sumlist b{color:var(--bd);font-weight:600}

/* track */
.rail-wrap{overflow-x:auto;padding:30px 4px 6px;margin:0 -4px}
.rail{position:relative;display:flex;justify-content:space-between;min-width:620px;padding:0 14px}
.rail-line{position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:9px;background:var(--ln);overflow:hidden}
.rail-line i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--sky),var(--ok));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.nd{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--sf);border:2px solid var(--ln);display:grid;place-items:center;font:500 11px/1 var(--fm);color:var(--mu);transition:background .4s,border-color .4s,color .4s}
.nd.st-done{background:var(--ok);border-color:var(--ok);color:#fff}
.nd.st-flag{background:var(--bd);border-color:var(--bd);color:#fff}
.nd.st-run{border-color:var(--sky);color:var(--sky);box-shadow:0 0 0 5px var(--sky2);animation:pulse 1.6s infinite}
.nd.st-na{border-style:dashed;opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.plane-m{position:absolute;top:-22px;transform:translateX(-50%);color:var(--am);transition:left 1.2s cubic-bezier(.4,0,.2,1);z-index:2;animation:hover-p 2.4s ease-in-out infinite}
@keyframes hover-p{50%{transform:translate(-50%,-4px)}}
.tlist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.ti{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;transition:border-color .3s,background .3s,transform .25s,box-shadow .25s}
.ti.st-run{border-color:var(--sky);background:var(--sky2)}
.ti.st-flag{border-color:var(--bd)}
.ti.st-na{opacity:.55}
.ti.clk{cursor:pointer}
.ti.clk:hover{transform:translateX(4px);box-shadow:var(--sh);border-color:var(--sky)}
.tic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf2);color:var(--sky)}
.ti.st-done .tic{background:var(--ok2);color:var(--ok)}
.ti.st-flag .tic{background:var(--bd2);color:var(--bd)}
.ti b{font-weight:600;font-size:14.5px;display:block}
.ti small{color:var(--mu);font-size:12.5px;line-height:1.4;display:block}
.tr{text-align:right;display:grid;gap:4px;justify-items:end}
.tr small{font:500 11px/1 var(--fm)}
.live{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--bd)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bd);animation:pulse 1.4s infinite}
.hcard{background:linear-gradient(135deg,var(--ink),#16406F);color:#EAF3FF;border-radius:24px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hcard h2{font-size:34px;position:relative}
.hcard p{color:#B9CCE6;position:relative;font-size:14.5px;margin-top:6px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--am);stroke-linecap:round;animation:ring 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font:700 42px/1 var(--fd)}
.ring .lbl small{font:500 11px/1.2 var(--fm);color:var(--sdi);letter-spacing:.08em;text-transform:uppercase}

/* station visuals */
.clk{cursor:pointer}
.kvs{display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:10px 14px;border-radius:12px;background:var(--sf2);font-size:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.kv span{color:var(--mu)}
.kv b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.kv.flag{background:var(--bd2)}
.kv.flag b{color:var(--bd)}
.sim-wrap{background:var(--sf2);border-radius:18px;padding:16px;display:grid;gap:12px;justify-items:center}
.sim{width:100%;max-width:520px;height:auto;display:block}
.sim-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:trace 1.8s .2s ease forwards}
.sim-pop{transform-box:fill-box;transform-origin:center;animation:pop2 .5s both}
@keyframes pop2{from{transform:scale(0);opacity:0}60%{transform:scale(1.15)}}
.ekg-p{fill:none;stroke:var(--sky);stroke-width:2;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:trace 2.4s linear infinite}
@keyframes trace{to{stroke-dashoffset:0}}
.sim-scanline{animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(150px)}}
.strips{display:grid;gap:10px;width:100%}
.strip{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:14px}
.strip i{display:block;height:22px;border-radius:99px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--ln);transform-origin:left;animation:stripIn .9s cubic-bezier(.2,.8,.2,1) both}
.strip i.neg{background:linear-gradient(90deg,var(--ok2),var(--ok))}
.strip i.pos{background:linear-gradient(90deg,var(--bd2),var(--bd))}
@keyframes stripIn{from{transform:scaleX(0)}}
.labs{display:grid;gap:9px;width:100%}
.lab{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13.5px}
.lab .tr2{position:relative;height:10px;border-radius:99px;background:var(--sf);overflow:visible}
.lab .tr2 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.lab .tr2 i.f{background:var(--bd)}
.lab .ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mu);left:71%}
.lab small{color:var(--mu);font-size:12px}
.eeg{display:grid;gap:6px;background:var(--sf);border-radius:14px;padding:10px;width:100%}
.eeg svg{width:100%;height:44px;display:block}
.eeg path{fill:none;stroke:var(--sky);stroke-width:1.4;stroke-dasharray:100;stroke-dashoffset:100;animation:trace 2.4s linear infinite}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.tiles div{padding:14px;border-radius:14px;background:var(--sf);display:grid;gap:4px}
.tiles small{color:var(--mu);font-size:12px}
.tiles b{font:600 28px/1 var(--fd)}
.heart-beat{transform-box:fill-box;transform-origin:center;animation:heartbeat 1s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.07)}}
.zone{transform-box:fill-box;transform-origin:center;animation:zonepulse 2.4s ease-in-out infinite}
@keyframes zonepulse{0%,100%{opacity:.25}50%{opacity:.7}}
.ish-reveal{animation:fade 1.2s .2s both}
.teeth-s{width:100%}
.shim{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--sf2),var(--ln),var(--sf2));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.pend{display:grid;gap:10px;padding:10px 0;width:100%}
.stn-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ray{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}

/* ---------- PATIENT ---------- */
.pt{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pt-top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sf) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.pt-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.ptabs{display:flex;gap:4px}
.ptabs button{padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mu);display:flex;gap:8px;align-items:center;transition:background .2s,color .2s}
.ptabs button:hover{color:var(--ink);background:var(--sf2)}
.ptabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pt-main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:24px max(18px,env(safe-area-inset-left,0px)) 110px;display:grid;gap:18px;align-content:start;min-width:0}
.pt-bot{display:none}
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.act button{display:grid;gap:10px;justify-items:start;padding:18px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);text-align:left;font-weight:600;transition:transform .25s,border-color .25s,box-shadow .25s}
.act button:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:var(--sh)}
.act .ico{width:42px;height:42px;border-radius:13px;background:var(--sky2);color:var(--sky);display:grid;place-items:center}
.wiz-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wiz-steps div{display:grid;gap:8px}
.wiz-steps i{height:5px;border-radius:99px;background:var(--ln);transition:background .4s}
.wiz-steps div.on i,.wiz-steps div.dn i{background:linear-gradient(90deg,var(--sky),var(--ok))}
.wiz-steps small{font:500 11px/1.2 var(--fm);color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.wiz-steps div.on small{color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.copt{display:grid;gap:8px;padding:18px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sf);text-align:left;transition:border-color .2s,background .2s,transform .2s}
.copt:hover{transform:translateY(-2px)}
.copt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky2)}
.copt b{font:600 22px/1 var(--fd)}
.copt small{color:var(--mu);font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dgrid button{display:grid;gap:2px;justify-items:center;padding:10px 4px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);transition:border-color .2s,background .2s,transform .2s}
.dgrid button:not(:disabled):hover{border-color:var(--sky);transform:translateY(-2px)}
.dgrid button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky2)}
.dgrid button:disabled{opacity:.4;cursor:not-allowed}
.dgrid .wd{font:500 11px/1 var(--fm);color:var(--mu);text-transform:uppercase}
.dgrid .dn{font:600 24px/1.1 var(--fd)}
.dgrid .sl{font:500 10.5px/1 var(--fm);color:var(--mu)}
.prep{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;transition:border-color .3s,background .3s}
.prep input{width:20px;height:20px;accent-color:var(--ok)}
.prep:has(input:checked){border-color:var(--ok);background:var(--ok2)}
.drop{position:relative;display:grid;place-items:center;gap:6px;text-align:center;padding:26px 18px;border-radius:18px;border:2px dashed var(--ln);background:var(--sf2);cursor:pointer;transition:border-color .25s,background .25s,transform .25s;min-height:170px}
.drop:hover,.drop.over{border-color:var(--sky);background:var(--sky2);transform:translateY(-2px)}
.drop .big{width:56px;height:56px;border-radius:18px;background:var(--sf);display:grid;place-items:center;color:var(--sky);box-shadow:var(--sh)}
.dslot{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.dslot.done{border-color:var(--ok)}
.thumb{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--sf2);display:grid;place-items:center;color:var(--sky);overflow:hidden;box-shadow:var(--sh)}
.thumb img{width:100%;height:100%;object-fit:cover}
.ubar{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:8px}
.ubar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--ok));transition:width .15s linear}
.ticket{position:relative;background:linear-gradient(135deg,var(--ink),#16406F);color:#EAF3FF;border-radius:24px;padding:26px;overflow:hidden;box-shadow:var(--sh)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.ticket .qr{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:132px;padding:8px;background:#fff;border-radius:12px}
.ticket .qr i{aspect-ratio:1;border-radius:1px}
.check-anim{width:96px;height:96px}
.check-anim circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .7s ease-out forwards}
.check-anim path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall 2.8s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.tfab{position:fixed;right:18px;bottom:18px;z-index:300;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--sh);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.tfab:hover{transform:rotate(25deg) scale(1.06)}
.pre{animation:none!important;opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.pre.in{opacity:1;transform:none}

/* ---------- SCROLLBAR (themed) ---------- */
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--sdm)}

/* ---------- ASSESSOR EXAM WORKSPACE (v2) ---------- */
.ax-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B1F3A 0%,#12335C 60%,#16406F 100%);color:#EAF3FF;border-radius:26px;padding:30px 32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--sh)}
.ax-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 85%);mask-image:linear-gradient(90deg,#000,transparent 85%)}
.ax-hero::after{content:"";position:absolute;width:360px;height:360px;right:-120px;top:-170px;border-radius:50%;background:radial-gradient(circle,var(--sky),transparent 65%);opacity:.4;animation:float 12s ease-in-out infinite alternate}
.ax-hero>*{position:relative;z-index:1}
.ax-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.svc-g{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0;counter-reset:s}
.svc{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1.05fr;gap:14px 44px;align-items:center;padding:52px 56px;border-radius:36px;border:0;box-shadow:none;cursor:pointer;background:linear-gradient(115deg,var(--sf) 0%,color-mix(in srgb,var(--sky) 14%,var(--sf)) 55%,color-mix(in srgb,var(--sky) 30%,var(--sf)) 100%);counter-increment:s}
.svc:nth-child(3n+2){background:linear-gradient(115deg,var(--sf) 0%,color-mix(in srgb,var(--am) 14%,var(--sf)) 55%,color-mix(in srgb,var(--am) 30%,var(--sf)) 100%)}
.svc:nth-child(3n+3){background:linear-gradient(115deg,var(--sf) 0%,color-mix(in srgb,var(--ok) 14%,var(--sf)) 55%,color-mix(in srgb,var(--ok) 30%,var(--sf)) 100%)}
.svc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.svc::after{content:"";position:absolute;inset:-35%;background:radial-gradient(circle at 75% 25%,color-mix(in srgb,var(--sky) 22%,transparent),transparent 55%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.svc::before{content:counter(s,decimal-leading-zero);position:absolute;right:40px;top:26px;font:700 120px/1 var(--fd);color:transparent;-webkit-text-stroke:1px var(--ln);z-index:0;pointer-events:none}
.svc>*{position:relative;z-index:1}
.svc>*:not(.svc-art){grid-column:1}
.svc-art{grid-column:2;grid-row:1 / span 4;min-height:300px;height:100%;border-radius:28px;background:color-mix(in srgb,var(--sf) 80%,transparent);box-shadow:var(--sh);border:1px solid var(--ln);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.svc:nth-child(even) .svc-art{grid-column:1;grid-row:1 / span 4}
.svc:nth-child(even)>*:not(.svc-art){grid-column:2}
.svc:hover .svc-art{border-color:var(--sky)}
.svc h3{font-size:clamp(34px,4vw,48px);line-height:1.02;margin-top:6px}
.svc p{font-size:17px;max-width:46ch;color:var(--mu)}
.svc .tag{align-self:start}
.svc .ft{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.svc .ft .btn{height:46px;padding:0 22px}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.08)}}
@media (max-width:860px){

  .svc::before{font-size:84px;right:20px;top:18px}
}

const flagOf=(R,k)=>{
  switch(k){
    case 'hist':return R.hist.some(h=>h[2]);
    case 'fis':return R.fis.some(h=>h[2]);
    case 'eye':return !!R.eye.flag;
    case 'ent':return Number(R.aud[4000])>25||Number(R.aud[8000])>30||(!!R.bal&&R.bal!=='Normal');
    case 'ekg':return !!R.ekg.flag;
    case 'xr':return !!R.xr.flag;
    case 'lab':return R.lab.some(l=>l[4]);
    case 'drug':return R.drug.some(d=>d[1]&&!/^(Negatif|0\.00)/.test(d[1]));
    case 'neu':return !!(R.neu&&R.neu.flag);
    case 'psy':return !!(R.psy&&Number(R.psy.score)>0&&Number(R.psy.score)<60);
    case 'den':return !!R.den.flag||R.den.items.some(i=>i[2]);
    default:return false;
  }
};
const noteOf=(R,k)=>{
  switch(k){
    case 'hist':return R.hist.filter(h=>h[2]).map(h=>h[0]+': '+h[1]).join('; ');
    case 'fis':return R.fis.filter(h=>h[2]).map(h=>h[0]+': '+h[1]).join('; ');
    case 'eye':return 'Visus '+R.eye.visOD+' / '+R.eye.visOS+'. Koreksi: '+R.eye.lensa;
    case 'ent':return 'Audiometri 4000 Hz '+R.aud[4000]+' dB, 8000 Hz '+R.aud[8000]+' dB. '+R.bal;
    case 'ekg':return R.ekg.kesan;
    case 'xr':return R.xr.kesan;
    case 'lab':return R.lab.filter(l=>l[4]).map(l=>l[0]+' '+l[1]+' '+l[2]).join('; ');
    case 'drug':return R.drug.filter(d=>d[1]&&!/^(Negatif|0\.00)/.test(d[1])).map(d=>d[0]+': '+d[1]).join('; ');
    case 'neu':return R.neu?R.neu.kesan:'';
    case 'psy':return R.psy?R.psy.kesan:'';

  }
};

function trackRail(p){
  const vis=TRACK.filter(s=>p.track[s.k].st!=='na');
  const n=vis.length;
  let idx=vis.findIndex(s=>p.track[s.k].st==='run');
  if(idx<0)idx=vis.findIndex(s=>p.track[s.k].st==='wait');
  const pct=idx<0?100:((idx+0.5)/n*100);
  const fillPct=idx<0?100:(idx/(n-1))*100;
  return `<div class="rail-wrap"><div class="rail">
    <div class="rail-line"><i style="width:${fillPct}%"></i></div>
    ${vis.map((s,i)=>`<div class="nd st-${p.track[s.k].st}" title="${esc(s.n)}">${p.track[s.k].st==='done'?ic('check',14):(i+1)}</div>`).join('')}
    <div class="plane-m" style="left:${pct}%">${ic('plane',18)}</div>
  </div></div>`;
}

const simDen=R=>{
  const badSet=R.den.items.filter(i=>i[2]).map(i=>+String(i[0]).replace(/\D/g,''));
  const upper=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
  const lower=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
  const tooth=(n,x,y,i)=>{const t=TTYPE[(n%10)-1];const b=badSet.includes(n);return `<g class="sim-pop" style="animation-delay:${(i*0.045).toFixed(3)}s"><path d="${TPATH[t]}" transform="translate(${x},${y})" fill="${b?'var(--bd2)':'var(--sf)'}" stroke="${b?'var(--bd)':'var(--ok)'}" stroke-width="1.4"/>${b?`<circle cx="${x+10}" cy="${y+12}" r="3.5" fill="var(--bd)"/>`:''}<text x="${x+10}" y="${y+37}" font-size="8" text-anchor="middle" fill="var(--mu)">${n}</text></g>`};
  const row=(arr,y)=>arr.map((n,i)=>tooth(n,10+i*21,y,i)).join('');
  return `<div class="sim-wrap" style="justify-items:stretch">
    <svg class="sim" viewBox="0 0 350 150" role="img" aria-label="Odontogram 32 gigi (sistem FDI)">
      <text x="6" y="14" font-size="9" fill="var(--mu)">Atas (rahang atas)</text>
      ${row(upper,18)}
      <line x1="175" y1="58" x2="175" y2="92" stroke="var(--mu)" stroke-dasharray="3 3"/>
      ${row(lower,92)}
      <text x="6" y="146" font-size="9" fill="var(--mu)">Bawah (rahang bawah)</text>
    </svg>
    <div class="row" style="gap:14px;font-size:12.5px;color:var(--mu)"><span>Sehat = hijau</span><span>Temuan = merah</span><span>FDI: I insisivus · C kaninus · P premolar · M molar</span></div>
  </div>`;
};
const simBody=R=>`<div class="sim-wrap" style="grid-template-columns:minmax(160px,220px) 1fr;align-items:center">
  <svg class="sim" viewBox="0 0 200 340" role="img" aria-label="Area pemeriksaan fisik">
    <ellipse cx="100" cy="38" rx="24" ry="30" fill="var(--sf)" stroke="var(--mu)" stroke-width="1.5"/>
    <rect x="90" y="64" width="20" height="14" fill="var(--sf)" stroke="var(--mu)" stroke-width="1.5"/>
    <path d="M74 74 Q100 66 126 74 L146 92 L158 176 L146 180 L136 124 L132 208 L124 330 L110 330 L104 212 L96 212 L90 330 L76 330 L68 208 L64 124 L54 180 L42 176 L54 92 Z" fill="var(--sf)" stroke="var(--mu)" stroke-width="1.5"/>
    <ellipse class="zone" cx="86" cy="112" rx="13" ry="21" fill="var(--sky)" opacity=".35"/>
    <ellipse class="zone" cx="114" cy="112" rx="13" ry="21" fill="var(--sky)" opacity=".35"/>
    <ellipse class="zone" cx="110" cy="118" rx="11" ry="10" fill="var(--bd)" opacity=".55" style="animation-delay:.6s"/>
    <rect class="zone" x="86" y="152" width="28" height="36" rx="10" fill="var(--ok)" opacity=".4" style="animation-delay:1.2s"/>
  </svg>
  <div class="kvs">${kv(R.fis.map(h=>[h[0],h[1],h[2]]))}<small class="mu sm">Area yang disorot: paru (biru), jantung (merah), abdomen (hijau).</small></div>
</div>`;
const imgBlock=(p,k)=>{const f=p.img&&p.img[k];return f&&f.url?`<div class="sim-wrap" style="justify-items:stretch"><img src="${f.url}" alt="${esc(f.name)}" style="width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:var(--sf)"><small class="mu sm">Gambar terlampir: ${esc(f.name)}</small></div>`:''};

/* ---------- STATION BODY (patient view) ---------- */
const stnBody=(p,k)=>{
  const st=p.track[k].st;
  if(st==='na')return `<div class="empty">Stasiun ini tidak diperlukan untuk pemeriksaan ${esc(p.type)}. Neurologi/EEG dan psikologi biasanya hanya ada pada pemeriksaan pertama (Initial).</div>`;
  const pendingNow=(st==='wait'||st==='run')&&k!=='ame'&&k!=='cert';
  if(pendingNow)return `<div class="sim-wrap"><div class="pend"><div class="shim"></div><div class="shim" style="width:70%"></div><div class="shim" style="width:85%"></div></div><p class="mu sm">${st==='run'?'Stasiun sedang berjalan. Hasil tampil saat assessor menyimpannya.':'Belum dimulai. Hasil tampil saat stasiun selesai.'}</p></div>`;
  const R=p.res||{};
  const filled=k==='reg'||k==='vit'||k==='ame'||k==='cert'||(p.res&&(
    k==='hist'?R.hist:k==='fis'?R.fis:k==='eye'?R.eye:k==='ent'?R.aud:k==='ekg'?R.ekg:k==='xr'?R.xr:k==='lab'?R.lab:k==='drug'?R.drug:k==='neu'?R.neu:k==='psy'?R.psy:k==='den'?R.den:null));
  if(!filled)return `<div class="empty">Hasil stasiun ini belum diisi assessor.</div>`;
  const img=imgBlock(p,k);
  let body='';
  if(k==='reg')body=`<div class="kvs">${DOCS[p.cls].map((d,i)=>`<div class="kv${i<p.docs?'':' flag'}"><span>${esc(d)}</span><b>${i<p.docs?'Terunggah':'Belum'}</b></div>`).join('')}</div>`;
  if(k==='vit')body=simTiles({bp:p.vit.bp,nadi:p.vit.nadi,tb:p.vit.tb,bb:p.vit.bb,imt:vitImt(p)})+kv([['Tekanan darah',p.vit.bp],['Nadi',p.vit.nadi+' x/menit'],['Tinggi',p.vit.tb+' cm'],['Berat',p.vit.bb+' kg'],['IMT',vitImt(p)+' kg/m²']]);
  if(k==='hist')body=kv(R.hist.map(h=>[h[0],h[1],h[2]]));
  if(k==='fis')body=simBody(R);
  if(k==='eye')body=simEye(R)+kv([['Visus OD (kanan)',R.eye.visOD,R.eye.visOD!=='6/6'],['Visus OS (kiri)',R.eye.visOS,R.eye.visOS!=='6/6'],['Buta warna (Ishihara)',R.eye.ishihara,false],['Lapang pandang',R.eye.lapang,false],['Phoria',R.eye.phoria,false],['Tekanan bola mata (TIO)',R.eye.tio,false],['Koreksi lensa',R.eye.lensa,R.eye.lensa!=='Tidak diperlukan']]);
  if(k==='ent')body=simEnt(R)+kv([['Audiometri 250–8000 Hz',AUD_F.map(f=>R.aud[f]).join(' · ')+' dB',Number(R.aud[4000])>25],['Timpanometri',R.timp,false],['Keseimbangan (vestibular)',R.bal,!!R.bal&&R.bal!=='Normal']]);
  if(k==='ekg')body=simEkg(R)+kv([['Frekuensi jantung',R.ekg.hr+' x/menit',false],['Irama',R.ekg.ritme,false],['Interval PR',R.ekg.pr,false],['Durasi QRS',R.ekg.qrs,false],['Interval QT',R.ekg.qt,false],['Kesan EKG',R.ekg.kesan,!!R.ekg.flag]]);
  if(k==='xr')body=simXr(R);
  if(k==='lab')body=simLab(R)+kv(R.lab.map(l=>[l[0],l[1]+(l[2]?' '+l[2]:'')+' (ref '+l[3]+')',!!l[4]]));
  if(k==='drug')body=simDrug(R)+kv(R.drug.map(d=>[d[0],d[1],false]));
  if(k==='neu')body=R.neu?simEeg(R)+kv([['Kesan EEG',R.neu.kesan,!!R.neu.flag]]):'<div class="empty">Tidak diperlukan.</div>';
  if(k==='psy')body=R.psy?simPsy(R)+kv([['Skor',R.psy.skor,false],['Kesan',R.psy.kesan,false]]):'<div class="empty">Tidak diperlukan.</div>';
  if(k==='den')body=simDen(R)+kv(R.den.items.map(i=>[i[0],i[1],!!i[2]]).concat([['Kesan',R.den.kesan,!!R.den.flag]]));
  if(k==='ame'){const L=limitasiList(p);return kv([['Keputusan AME',p.status,false],['Masa berlaku',p.exp?fmt(p.exp):'—',false],['Assessor',p.assessor||'—',false]])+`<h3 style="font-size:20px;margin-top:6px">Limitasi & temuan</h3>${L.length?kv(L.map(x=>[x[0],x[1],true])):'<div class="kv"><span>Temuan</span><b>Tidak ada temuan tindak lanjut</b></div>'}`}
  if(k==='cert')return kv([['Keputusan',p.status,false],['Limitasi',p.lim||'—',!!p.lim&&p.lim!=='Tanpa limitasi'&&p.lim!=='-'],['Berlaku sampai',p.exp?fmt(p.exp):'—',false],['Assessor',p.assessor||'—',false],['Catatan',p.notes||'—',false]]);
  return img+body;
};

const inpF=(label,path,val,opts={})=>`<label class="fld">${esc(label)}<input class="inp" ${opts.root?`data-root="${opts.root}"`:''} data-path="${path}" ${opts.num?'type="number" step="any"':''} value="${esc(val)}" placeholder="${esc(opts.ph||'')}"></label>`;
const chkF=(path,val,label='Ada temuan / perlu tindak lanjut')=>`<label class="chk"><input type="checkbox" data-path="${path}" ${val?'checked':''}> ${esc(label)}</label>`;
const upF=(k,p)=>{const f=p.img&&p.img[k];return `<div class="upbox"><div class="upthumb">${f&&f.url?`<img src="${f.url}" alt="${esc(f.name)}">`:ic('camera',30)}</div><div style="display:grid;gap:8px"><b>Gambar hasil (opsional)</b><small class="mu sm">${f?esc(f.name):'Belum ada gambar. Ambil foto atau pilih berkas (JPG, PNG, PDF).'}</small><div class="row" style="gap:8px"><label class="btn btn-sm" style="cursor:pointer">${ic('upload',14)} Pilih gambar<input type="file" hidden accept="image/*,application/pdf" capture="environment" data-img="${k}"></label>${f?`<button class="btn btn-sm" data-a="imgdel" data-v="${k}">${ic('trash',14)} Hapus</button>`:''}</div></div></div>`};
function stationForm(p,k){
  const R=ensureRes(p);
  const L=(x)=>x;
  if(k==='reg')return `<div class="kvs">${DOCS[p.cls].map((d,i)=>`<div class="kv${i<p.docs?'':' flag'}"><span>${esc(d)}</span><b>${i<p.docs?'Terunggah':'Belum'}</b></div>`).join('')}</div>
    <p class="mu sm">Dokumen diverifikasi admin. Simpan stasiun ini setelah dokumen lengkap.</p>
    ${p.status==='Menunggu verifikasi'?`<button class="btn btn-am" data-a="verifyNow" data-v="${esc(p.id)}">Verifikasi dokumen</button>`:''}`;
  if(k==='vit')return `<div class="fgrid">${inpF('Tekanan darah (mmHg)','vit.bp',p.vit.bp,{root:'p',ph:'120/80'})}${inpF('Nadi (x/menit)','vit.nadi',p.vit.nadi,{root:'p',num:1,ph:'72'})}${inpF('Tinggi (cm)','vit.tb',p.vit.tb,{root:'p',num:1,ph:'170'})}${inpF('Berat (kg)','vit.bb',p.vit.bb,{root:'p',num:1,ph:'70'})}</div>
    <div class="row between" style="margin-top:6px"><span class="mu sm">IMT (otomatis)</span><b class="imtbox" id="imtOut">${vitImt(p)}</b></div>`;
  if(k==='hist'||k==='fis')return `${R[k].map((h,i)=>`<div class="frow"><span>${esc(h[0])}</span><input class="inp" data-path="${k}.${i}.1" value="${esc(h[1])}"><label class="chk"><input type="checkbox" data-path="${k}.${i}.2" ${h[2]?'checked':''}> Temuan</label></div>`).join('')}`;
  if(k==='eye')return `<div class="fgrid">${inpF('Visus OD (kanan)','eye.visOD',R.eye.visOD,{ph:'6/6'})}${inpF('Visus OS (kiri)','eye.visOS',R.eye.visOS,{ph:'6/6'})}${inpF('Buta warna (Ishihara)','eye.ishihara',R.eye.ishihara)}${inpF('Lapang pandang','eye.lapang',R.eye.lapang)}${inpF('Phoria','eye.phoria',R.eye.phoria)}${inpF('Tekanan bola mata (TIO)','eye.tio',R.eye.tio,{ph:'15 / 15 mmHg'})}${inpF('Koreksi lensa','eye.lensa',R.eye.lensa)}</div>${chkF('eye.flag',R.eye.flag)}${upF(k,p)}`;
  if(k==='ent')return `<div class="fgrid three">${AUD_F.map(f=>inpF(`Ambang ${f>=1000?(f/1000)+' kHz':f+' Hz'} (dB HL)`,'aud.'+f,R.aud[f],{num:1,ph:'10'})).join('')}</div><div class="fgrid">${inpF('Timpanometri','timp',R.timp)}${inpF('Keseimbangan (vestibular)','bal',R.bal)}</div>${upF(k,p)}`;
  if(k==='ekg')return `<div class="fgrid three">${inpF('Frekuensi jantung (x/menit)','ekg.hr',R.ekg.hr,{num:1})}${inpF('Irama','ekg.ritme',R.ekg.ritme)}${inpF('Interval PR','ekg.pr',R.ekg.pr,{ph:'160 ms'})}${inpF('Durasi QRS','ekg.qrs',R.ekg.qrs,{ph:'88 ms'})}${inpF('Interval QT','ekg.qt',R.ekg.qt,{ph:'380 ms'})}</div>${inpF('Kesan EKG','ekg.kesan',R.ekg.kesan)}${chkF('ekg.flag',R.ekg.flag)}${upF(k,p)}`;
  if(k==='xr')return `<div class="fgrid three">${inpF('FEV1 (% prediksi)','xr.fev1',R.xr.fev1)}${inpF('FVC (% prediksi)','xr.fvc',R.xr.fvc)}${inpF('Rasio FEV1/FVC','xr.ratio',R.xr.ratio)}</div>${inpF('Kesan rontgen thorax','xr.kesan',R.xr.kesan)}${chkF('xr.flag',R.xr.flag)}${upF(k,p)}`;
  if(k==='lab')return `${R.lab.map((l,i)=>`<div class="frow"><span>${esc(l[0])} <small class="mu">(ref ${esc(l[3])} ${esc(l[2])})</small></span><input class="inp" data-path="lab.${i}.1" value="${esc(l[1])}"><label class="chk"><input type="checkbox" data-path="lab.${i}.4" ${l[4]?'checked':''}> Tinggi/abnormal</label></div>`).join('')}${upF(k,p)}`;
  if(k==='drug')return `${R.drug.map((d,i)=>`<div class="frow"><span>${esc(d[0])}</span><input class="inp" data-path="drug.${i}.1" value="${esc(d[1])}"><span class="mu sm">${/^(Negatif|0\.00)/.test(d[1])?'Normal':'Positif'}</span></div>`).join('')}${upF(k,p)}`;
  if(k==='neu'){if(!R.neu)R.neu={kesan:'',flag:false};return `${inpF('Kesan EEG','neu.kesan',R.neu.kesan)}${chkF('neu.flag',R.neu.flag)}${upF(k,p)}`}
  if(k==='psy'){if(!R.psy)R.psy={skor:'',score:0,kesan:''};return `<div class="fgrid">${inpF('Skor (0–100)','psy.score',R.psy.score,{num:1})}${inpF('Kesan','psy.kesan',R.psy.kesan)}</div><input type="hidden" data-path="psy.skor" value="">`;}
  if(k==='den'){return `<div class="frow" style="grid-template-columns:1fr 1fr auto"><span class="mu sm">Gigi</span><span class="mu sm">Temuan</span><span></span></div>${R.den.items.map((it,i)=>`<div class="frow"><input class="inp" data-path="den.items.${i}.0" value="${esc(it[0])}" placeholder="Gigi 36"><input class="inp" data-path="den.items.${i}.1" value="${esc(it[1])}"><label class="chk"><input type="checkbox" data-path="den.items.${i}.2" ${it[2]?'checked':''}> Temuan</label></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn btn-sm" data-a="addtooth">${ic('plus',14)} Tambah gigi</button></div>${inpF('Kesan odontogram','den.kesan',R.den.kesan)}${upF(k,p)}`;}
  return '';
}

    <div class="row between sm"><span class="mu">${nx?'Berikutnya: <b style="color:var(--ink)">'+esc(nx.n)+'</b>':'Semua stasiun selesai'}</span><span class="mono">${pct}%</span></div>

function pHome(){

  <div class="hcard rise">
    <div class="ring" aria-hidden="true" style="--c:${C}">
      <svg viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="${R}"/><circle class="fg" cx="70" cy="70" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="lbl">${days==null?'<b>—</b><small>Belum aktif</small>':`<b data-count="${Math.max(0,days)}">0</b><small>hari lagi</small>`}</div>
    </div>
    <div>
      <span class="eyebrow" style="color:#9CC8F0">Sertifikat aktif</span>

      <p>${days==null?'Daftar pemeriksaan untuk mendapatkan sertifikat pertama Anda.':esc(lf.lim)+'. Kelas '+lf.cls+' · '+esc(lf.type)+'.'}</p>

  ${a?liveCard(a):`<div class="card rise row between"><div class="row" style="gap:12px">${ic('plane',24)}<div><b>Belum ada pemeriksaan aktif</b><div class="mu sm">Daftar medex untuk memulai track pemeriksaan Anda.</div></div></div><button class="btn btn-am btn-sm" data-a="pnav" data-v="book">Daftar sekarang</button></div>`}
  ${remind?`<div class="card rise row between" style="border-color:var(--am)"><div class="row" style="gap:12px">${ic('alert',22)}<div><b>Waktunya perpanjang</b><div class="mu sm">Daftar 2–4 minggu sebelum sertifikat habis agar ada waktu bila diperlukan pemeriksaan tambahan.</div></div></div><button class="btn btn-am btn-sm" data-a="pnav" data-v="book">Daftar renewal</button></div>`:''}

    <button class="rise" data-a="pnav" data-v="docs" style="animation-delay:.1s"><span class="ico">${ic('camera',20)}</span>Foto dokumen</button>
    <button class="rise" data-a="pnav" data-v="profile" style="animation-delay:.15s"><span class="ico">${ic('user',20)}</span>Profil saya</button>

    body=`<div class="card grid rise" style="gap:16px"><div><span class="eyebrow">Langkah 5</span><h2 style="font-size:30px;margin-top:4px">Konfirmasi</h2></div>

  }

}
function slotHTML(key,label){

  if(f&&f.prog>=100){
    return `<div class="dslot done">
      ${f.img?`<div class="thumb"><img src="${f.url}" alt="Pratinjau ${esc(label)}"></div>`:`<div class="thumb">${ic('file',34)}</div>`}

        <small class="mu mono" style="overflow-wrap:anywhere">${esc(f.name)} · ${kb(f.size)}</small>
        <div class="row" style="gap:8px"><label class="btn btn-sm" style="cursor:pointer">${ic('upload',14)} Ganti<input type="file" hidden accept="image/*,application/pdf" capture="environment" data-upl="${key}"></label><button class="btn btn-sm" data-a="udel" data-v="${key}">${ic('trash',14)} Hapus</button></div>
      </div></div>`;

      <span class="big">${ic('camera',26)}</span>

    </label>`;
}
function successView(id){
  const p=db.patients.find(x=>x.id===id);
  if(!p)return '';
  const seed=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);
  let cells='';
  for(let r=0;r<11;r++)for(let c=0;c<11;c++){const on=((r*7+c*13+seed)%5)<2||(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);cells+=`<i style="background:${on?'#0B1F3A':'transparent'}"></i>`}
  return `<div class="card rise" style="display:grid;gap:20px;justify-items:center;text-align:center;padding:34px 22px">
    <svg class="check-anim" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45"/><path d="M30 52 L44 65 L71 37"/></svg>
    <div><span class="eyebrow">Pendaftaran tercatat</span><h2 style="font-size:40px;margin-top:6px">Sampai jumpa di hari pemeriksaan</h2><p class="mu" style="margin-top:6px">Track pemeriksaan akan aktif pada tanggal ${fmt(p.date)}.</p></div>
    <div class="ticket" style="width:100%;max-width:520px;text-align:left">
      <div class="row between" style="align-items:start"><div><span class="eyebrow" style="color:#9CC8F0">Tiket pemeriksaan</span><div style="font:600 28px/1.1 var(--fd);margin-top:6px">${esc(p.name)}</div><div style="color:#B9CCE6;font-size:14px;margin-top:4px">Class ${p.cls} · ${esc(p.type)}</div></div>
      <div class="qr" aria-label="Kode pendaftaran">${cells}</div></div>
      <div style="border-top:1px dashed rgba(255,255,255,.25);margin:18px 0 14px"></div>
      <div class="row between" style="gap:14px"><div><small style="color:#9CC8F0">Nomor</small><div class="mono" style="font-size:18px">${esc(p.id)}</div></div><div><small style="color:#9CC8F0">Tanggal</small><div style="font-size:16px">${fmt(p.date)}</div></div><div><small style="color:#9CC8F0">Sesi</small><div style="font-size:16px">${esc(p.ses)}</div></div></div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="copy" data-v="${esc(p.id)}">${ic('copy',16)} Salin nomor</button><button class="btn btn-am" data-a="afterok">Buka track & status</button></div>
  </div>`;
}

function stepper(p){

  const root=$('#root');
  let h='';
  if(S.screen==='landing')h=landing();
  else if(S.screen==='login')h=login();
  else if(S.role==='patient')h=patient();
  else if(S.role==='assessor')h=shell('assessor',({queue:'Antrean pemeriksaan',exam:'Pemeriksaan pasien',history:'Riwayat keputusan'})[S.page]||'Antrean pemeriksaan','Assessor · AME',assessorPage());
  else h=shell('admin',({dashboard:'Ringkasan klinik',regs:'Pendaftaran',sched:'Jadwal & kuota',svc:'Layanan',users:'Pengguna',reports:'Laporan',settings:'Pengaturan'})[S.page]||'Ringkasan klinik','Administrator',adminPage());
  root.innerHTML=h;
  S.liveH=null;
  runAnim();
}
function runAnim(){
  $$('[data-count]').forEach(el=>{
    const end=+el.dataset.count;
    if(RM){el.textContent=end;return}
    let t0=null;const step=t=>{if(t0===null)t0=t;const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
  const st=$('#steps');
  if(st&&'IntersectionObserver' in window){const o=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){st.classList.add('in');o.disconnect()}})},{threshold:.3});o.observe(st)}
  else if(st)st.classList.add('in');
  if(S.screen==='landing'&&'IntersectionObserver' in window&&!RM){
    const ro=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}})},{threshold:.12});
    document.querySelectorAll('.rise,.stp,.feat .card,.faq .qa,.cinfo .card,.sh,.cta,.cls').forEach((el,i)=>{
      if(el.getBoundingClientRect().top>innerHeight*0.9){el.classList.add('pre');el.style.transitionDelay=((i%4)*100)+'ms';ro.observe(el)}
    });
  }
  if(S.screen==='landing'&&$('.svc-g')){slideGo(S.slide);slideTick()}
  if(S.screen==='landing'){
    const lnav=$('#lnav');
    const onS=()=>lnav&&lnav.classList.toggle('sc',scrollY>10);
    onS();window.onscroll=onS;
  } else window.onscroll=null;
}

/* live refresh of patient track when staff update it */
setInterval(()=>{
  if(S.role!=='patient'||!(S.page==='home'||S.page==='status'))return;
  const a=activeOf();if(!a)return;
  const h=trkHash(a)+JSON.stringify(a.res&&Object.keys(a.res).length?1:0)+(a.status);
  if(h===S.liveH)return;
  const first=S.liveH===null;
  S.liveH=h;
  if(first)return;
  render();

},2500);

/* ---------- actions ---------- */
function setSel(id){S.sel=id;S.stn=null;const p=db.patients.find(x=>x.id===id);if(p&&p.status==='Siap diperiksa'){p.status='Diperiksa';logA('Pemeriksaan dimulai: '+p.name)}}
function keep(id){const el=document.getElementById(id);return el?{pos:el.selectionStart}:null}
function restore(id,k){if(!k)return;const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(k.pos,k.pos)}catch(e){}}}
function setAt(root,path,val){
  const parts=path.split('.');let o=root;
  for(let i=0;i<parts.length-1;i++){const key=/^\d+$/.test(parts[i])?+parts[i]:parts[i];if(o[key]==null)o[key]={};o=o[key]}
  const last=parts[parts.length-1];const key=/^\d+$/.test(last)?+last:last;o[key]=val;
}
function takeFile(key,f){
  if(!f)return;
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  const img=f.type.startsWith('image/');
  if(S.upl[key]&&S.upl[key].url)URL.revokeObjectURL(S.upl[key].url);
  S.upl[key]={name:f.name,size:f.size,img,url:img?URL.createObjectURL(f):'',prog:0};
  render();
  let p=0;
  const iv=setInterval(()=>{
    const cu=S.upl[key];if(!cu){clearInterval(iv);return}
    p=Math.min(100,p+10+Math.random()*14);cu.prog=p;
    const el=document.querySelector(`[data-prog="${key}"]`);if(el)el.style.width=p+'%';
    if(p>=100){clearInterval(iv);render();toast('Berkas terunggah: '+f.name)}
  },110);
}
function takeStationImg(p,k,f){
  if(!f)return;
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  if(!p.img)p.img={};
  if(p.img[k]&&p.img[k].url)URL.revokeObjectURL(p.img[k].url);
  p.img[k]={name:f.name,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',pdf:f.type==='application/pdf'};
  logA('Gambar terlampir ('+(TRACK.find(s=>s.k===k)||{n:k}).n+'): '+p.name);
  toast('Gambar terlampir: '+f.name);render();
}

      </div>`);return}
    case 'resched':{const p=db.patients.find(x=>x.id===v);const d=$('#rdate').value;if(p&&d!==p.date){if(countOn(d)>=quotaOf(d)){toast('Kuota tanggal itu sudah penuh');return}p.date=d;logA('Jadwal diubah: '+p.name+' ke '+fmt(d));toast('Jadwal diperbarui')}closeM();break}
    case 'verify':{const p=db.patients.find(x=>x.id===v);if(p){p.status='Siap diperiksa';p.track.reg.st='done';logA('Dokumen diverifikasi: '+p.name);toast(p.name+' siap diperiksa')}closeM();break}
    case 'verifyNow':{const p=db.patients.find(x=>x.id===v);if(p){p.status='Siap diperiksa';p.track.reg.st='done';p.track.reg.t=nowT();logA('Dokumen diverifikasi: '+p.name);toast('Dokumen diverifikasi')}break}
    case 'svc':{const s=db.services.find(x=>x.id===v);if(s){s.on=!s.on;logA((s.on?'Layanan diaktifkan: ':'Layanan dinonaktifkan: ')+s.n);toast(s.n+(s.on?' diaktifkan':' dinonaktifkan'))}break}
    case 'svcadd':openM(`
      <div><span class="eyebrow">Layanan baru</span><h3 style="margin-top:4px">Tambah layanan</h3></div>

      <div class="err" id="serr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="svcsave">Simpan</button></div>`);break;
    case 'svcsave':{const n=$('#sn').value.trim();if(!n){$('#serr').textContent='Nama layanan wajib diisi.';return}db.services.unshift({id:'s'+Date.now(),cat:$('#sc').value,n,d:$('#sd').value.trim()||'Deskripsi belum diisi.',i:'svc',dur:'1 hari',on:false});logA('Layanan baru: '+n);closeM();toast('Layanan ditambahkan (nonaktif)');break}
    case 'usr':{const u=db.users.find(x=>x.id===v);if(u){u.on=!u.on;toast(u.n+(u.on?' bisa masuk':' dinonaktifkan'))}break}
    case 'usradd':openM(`
      <div><span class="eyebrow">Undang</span><h3 style="margin-top:4px">Pengguna baru</h3></div>
      <label class="fld">Nama<input class="inp" id="un" placeholder="Nama lengkap"></label>
      <label class="fld">Email<input class="inp" id="ue" type="email" placeholder="nama@klinik.id"></label>
      <label class="fld">Peran<select class="sel" id="ur"><option>Administrator</option><option>Assessor</option></select></label>
      <div class="err" id="uerr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="usrsave">Kirim undangan</button></div>`);break;
    case 'usrsave':{const n=$('#un').value.trim(),e=$('#ue').value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(e)){$('#uerr').textContent='Isi nama dan email yang valid.';return}db.users.push({id:'u'+Date.now(),n,r:$('#ur').value,e,on:false});logA('Undangan dikirim ke '+e);closeM();toast('Undangan dikirim (akses nonaktif sampai diaktifkan)');break}
    case 'copyrep':{const txt='Ringkasan Medex Online: total '+db.patients.length+' pendaftar, menunggu verifikasi '+db.patients.filter(p=>p.status==='Menunggu verifikasi').length+', fit/limitasi '+db.patients.filter(p=>BENEFIT(p)).length+'.';try{navigator.clipboard.writeText(txt).then(()=>toast('Ringkasan disalin'),()=>toast('Salin manual dari tabel'))}catch(e){toast('Salin manual dari tabel')}return}
    case 'close':closeM();return;
    case 'savest':{
      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      if(FINAL.includes(p.status)){toast('Keputusan sudah terbit');break}
      const k=v;
      if(k==='vit'&&(!p.vit.bp||!p.vit.nadi||!p.vit.tb||!p.vit.bb)){toast('Lengkapi tekanan darah, nadi, tinggi, dan berat');break}
      const f=flagOf(p.res||{},k);
      p.track[k]={st:f?'flag':'done',t:nowT()};
      if(p.status==='Siap diperiksa')p.status='Diperiksa';
      logA((f?'Temuan: ':'Selesai: ')+(TRACK.find(s=>s.k===k)||{n:k}).n+' · '+p.name);
      const nextS=WORK.find(s=>p.track[s.k].st!=='done'&&p.track[s.k].st!=='flag'&&p.track[s.k].st!=='na');
      S.stn=nextS?nextS.k:k;
      toast(f?'Tersimpan dengan temuan — tandai tindak lanjut':'Hasil stasiun tersimpan');
      break;
    }
    case 'imgdel':{const p=db.patients.find(x=>x.id===S.sel);if(p&&p.img&&p.img[v]){if(p.img[v].url)URL.revokeObjectURL(p.img[v].url);delete p.img[v];toast('Gambar dihapus')}break}
    case 'addtooth':{const p=db.patients.find(x=>x.id===S.sel);if(p){ensureRes(p);p.res.den.items.push(['Gigi ','Sehat',false]);}break}

      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      const missing=WORK.filter(s=>!['done','flag','na'].includes(p.track[s.k].st));
      if(missing.length){toast('Belum selesai: '+missing[0].n);S.stn=missing[0].k;break}
      if(!p.vit.bp||!p.vit.nadi||!p.vit.tb||!p.vit.bb){toast('Lengkapi tanda vital terlebih dahulu');return}
      const flagged=TRACK.filter(s=>p.track[s.k].st==='flag');
      if(!FINAL.includes(p.pend)){toast('Pilih satu keputusan');return}
      if(p.pend==='Fit'&&flagged.length){toast('Ada temuan tindak lanjut. Pilih keputusan dengan limitasi atau sementara tidak layak.');return}
      if(p.pend==='Fit with limitation'&&!(($('#lim')||{value:''}).value||'').trim()){toast('Isi limitasi untuk keputusan ini');return}
      openM(`<div><span class="eyebrow">Konfirmasi</span><h3 style="margin-top:4px">Terbitkan keputusan?</h3></div>
        <p class="mu">Keputusan untuk <b>${esc(p.name)}</b> akan terkunci dan tampil di track dan portal pasien.</p>
        <div class="card" style="background:var(--sf2);box-shadow:none">${badge(p.pend)}${p.pend==='Fit with limitation'?`<p class="sm" style="margin-top:8px">Limitasi: ${esc($('#lim').value.trim())}</p>`:''}${flagged.length?`<p class="sm" style="margin-top:8px">Temuan: ${flagged.map(s=>esc(s.n)).join(', ')}</p>`:''}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="finalize">Terbitkan</button></div>`);return}
    case 'finalize':{
      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      p.notes=($('#notes')||{value:p.notes}).value;
      p.status=p.pend;p.pend=null;
      if(p.status==='Fit with limitation')p.lim=$('#lim').value.trim();
      else if(p.status==='Fit')p.lim='Tanpa limitasi';
      else p.lim='-';
      p.exp=BENEFIT(p)?addM(TODAY,CLS_MONTHS[p.cls]):'';
      p.assessor=ASSESSOR;
      p.track.ame={st:'done',t:nowT()};p.track.cert={st:'done',t:nowT()};
      logA('Keputusan '+p.status+': '+p.name);
      closeM();toast('Keputusan diterbitkan: '+p.status);S.page='queue';S.sel=null;S.stn=null;break;
    }
    case 'pnav':S.page=v;window.scrollTo(0,0);break;
    case 'stn':{const [pid,k]=v.split('|');const p=db.patients.find(x=>x.id===pid);if(!p)break;openM(stationModal(p,k));$('#mbox').classList.add('wide');return}
    case 'wcls':S.wiz.cls=+v;break;
    case 'wtype':S.wiz.type=v;break;
    case 'wdate':S.wiz.date=v;S.wiz.err='';break;
    case 'wses':S.wiz.ses=v;break;
    case 'wnext':{
      const w=S.wiz;w.err='';
      if(w.step===1){
        if(!w.name.trim()||!w.org.trim()||!w.phone.trim()){w.err='Lengkapi nama, instansi, dan nomor HP.';break}
        if(!/^\S+@\S+\.\S+$/.test(w.email)){w.err='Format email belum benar.';break}
        w.cls=CLS_BY_JOB[w.job]||1;
      }
      if(w.step===3&&!w.date){w.err='Pilih tanggal pemeriksaan.';break}
      if(w.step===4){const docs=DOCS[w.cls];const missing=docs.filter((_,i)=>!(S.upl[w.cls+'-'+i]&&S.upl[w.cls+'-'+i].prog>=100));if(missing.length){w.err='Unggah dokumen yang belum lengkap: '+missing.join(', ')+'.';break}}
      w.step=Math.min(5,w.step+1);break;
    }
    case 'wback':S.wiz.step=Math.max(1,S.wiz.step-1);S.wiz.err='';break;
    case 'wsubmit':{
      const w=S.wiz;
      if(!w.prep.every(Boolean)||!w.agree){w.err='Centang semua persiapan dan persetujuan untuk mengirim.';break}
      const seq=db.patients.length+1;
      const id='LS-'+TODAY.slice(2,4)+TODAY.slice(5,7)+TODAY.slice(8,10)+'-'+String(400+seq);
      const c=cur()||{};
      const docsN=DOCS[w.cls].filter((_,i)=>S.upl[w.cls+'-'+i]).length;
      db.patients.push(mk({id,owner:'pratama',name:w.name,job:w.job,org:w.org,cls:w.cls,type:w.type,email:w.email,phone:w.phone,date:w.date,ses:w.ses,status:'Menunggu verifikasi',lic:c.lic||'',docs:docsN,doc:w.doc,time:w.time,svc:w.svc}));
      logA('Pendaftaran baru: '+w.name+' ('+id+')');
      w.ok=id;confetti();break;
    }
    case 'afterok':S.wiz=null;S.page='status';break;
    case 'udel':{const f=S.upl[v];if(f&&f.url)URL.revokeObjectURL(f.url);delete S.upl[v];break}
    default:return;
  }
  render();
}

});

  if(f.id==='setf'){const fd=new FormData(f);db.clinic={...db.clinic,name:fd.get('name'),addr:fd.get('addr'),hours:fd.get('hours'),phone:fd.get('phone')};toast('Pengaturan disimpan');return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){const k=keep('q');S.q=t.value;S.pg=1;render();restore('q',k);return}
  if(t.dataset.wf&&S.wiz&&t.dataset.wf!=='agree'){S.wiz[t.dataset.wf]=t.value;return}
  if(t.dataset.path&&S.sel){
    const p=db.patients.find(x=>x.id===S.sel);if(!p)return;
    const root=t.dataset.root==='p'?p:ensureRes(p);
    let val=t.type==='checkbox'?t.checked:t.value;
    if(t.type==='number')val=t.value===''?'':Number(t.value);
    if(t.dataset.path.startsWith('aud.')||t.dataset.path==='psy.score')val=val===''?'':Number(val);
    setAt(root,t.dataset.path,val);
    if(t.dataset.path.startsWith('vit.')){const b=$('#imtOut');if(b)b.textContent=vitImt(p)}
    return;
  }
  if(t.id==='notes'){const p=db.patients.find(x=>x.id===S.sel);if(p)p.notes=t.value;return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.quota){const d=t.dataset.quota;db.quota[d]=Math.max(1,+t.value||1);logA('Kuota '+fmt(d)+' diubah ke '+db.quota[d]);render();return}
  if(t.dataset.wf==='job'&&S.wiz){S.wiz.job=t.value;S.wiz.cls=CLS_BY_JOB[t.value]||1;return}
  if(t.dataset.wf==='agree'&&S.wiz){S.wiz.agree=t.checked;return}
  if(t.dataset.prep!==undefined&&S.wiz){S.wiz.prep[+t.dataset.prep]=t.checked;return}
  if(t.dataset.path&&S.sel){const p=db.patients.find(x=>x.id===S.sel);if(p){const root=t.dataset.root==='p'?p:ensureRes(p);setAt(root,t.dataset.path,t.type==='checkbox'?t.checked:t.value);if(t.dataset.path.startsWith('vit.')){const b=$('#imtOut');if(b)b.textContent=vitImt(p)}}return}
  if(t.dataset.img!==undefined&&S.sel){const p=db.patients.find(x=>x.id===S.sel);takeStationImg(p,t.dataset.img,t.files&&t.files[0]);t.value='';return}
  if(t.dataset.upl!==undefined){takeFile(t.dataset.upl,t.files&&t.files[0]);t.value='';return}
  if(t.id==='fIn'){S.filter=t.value}
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  takeFile(z.dataset.drop,e.dataTransfer.files[0]);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('#theme');if(!t)return;
  const root=document.documentElement;
  const cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  root.dataset.theme=cur==='dark'?'light':'dark';
  t.innerHTML=ic(root.dataset.theme==='dark'?'sun':'moon',20);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeM()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('li.clk')){e.preventDefault();e.target.click()}});

$('#theme').innerHTML=ic(matchMedia('(prefers-color-scheme: dark)').matches?'sun':'moon',20);
render();
})();
</script>
