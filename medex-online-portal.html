    case 'svcvar':{const [id,c,t]=v.split('|');const s=db.services.find(x=>x.id===id);S.svcVar={cls:+c,type:t};if(s){S.sheetSvc=s.id;openM(svcModal(s));$('#mbox').classList.add('wide')}return}
    case 'faq':S.faq=S.faq===+v?-1:+v;break;
    case 'copy':{const done=()=>toast('Disalin: '+v);try{navigator.clipboard.writeText(v).then(done,()=>toast('Salin manual: '+v))}catch(e){toast('Salin manual: '+v)}return}
    case 'nav':S.page=v;S.q='';S.f='Semua';S.pg=1;break;
    case 'fst':S.f=v;S.pg=1;break;
    case 'pg':S.pg=Math.max(1,+v);break;
    case 'pick':setSel(v);S.page='exam';break;
    case 'pickst':S.stn=v;break;
    case 'open':{const p=db.patients.find(x=>x.id===v);if(!p)break;openM(`
      <div class="row between"><div><span class="eyebrow">Detail pendaftar</span><h3 style="margin-top:4px">${esc(p.name)}</h3></div><button class="icbtn" data-a="close" aria-label="Tutup">${ic('x',18)}</button></div>
      <dl style="display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0;font-size:14.5px">
        <dt class="mu">Nomor</dt><dd class="mono" style="margin:0">${esc(p.id)}</dd>
        <dt class="mu">Pekerjaan</dt><dd style="margin:0">${esc(p.job)} · ${esc(p.org)}</dd>
        <dt class="mu">Kelas</dt><dd style="margin:0">Class ${p.cls} · ${esc(p.type)}</dd>
        <dt class="mu">Sesi</dt><dd style="margin:0">${fmt(p.date)} · ${esc(p.ses)}</dd>
        <dt class="mu">Status</dt><dd style="margin:0">${badge(p.status)}</dd>
        <dt class="mu">Kontak</dt><dd style="margin:0">${esc(p.email||'—')} · ${esc(p.phone||'—')}</dd>
      </dl>
      <div><div class="row between sm"><span class="mu">Track CASR</span><span class="mono">${trackPct(p)}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${trackPct(p)}%"></i></div></div>
      <label class="fld">Pindahkan jadwal<select class="sel" id="rdate">${weekdays(1,14).map(d=>`<option value="${d}" ${d===p.date?'selected':''}>${fmtL(d)} (sisa ${quotaOf(d)-countOn(d)})</option>`).join('')}</select></label>
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap">
        <button class="btn" data-a="resched" data-v="${esc(p.id)}">Simpan jadwal</button>
        ${p.status==='Menunggu verifikasi'?`<button class="btn btn-am" data-a="verify" data-v="${esc(p.id)}">Verifikasi & siapkan</button>`:''}
      </div>`);return}
    case 'resched':{const p=db.patients.find(x=>x.id===v);const d=$('#rdate').value;if(p&&d!==p.date){if(countOn(d)>=quotaOf(d)){toast('Kuota tanggal itu sudah penuh');return}p.date=d;logA('Jadwal diubah: '+p.name+' ke '+fmt(d));toast('Jadwal diperbarui')}closeM();break}
    case 'verify':{const p=db.patients.find(x=>x.id===v);if(p){p.status='Siap diperiksa';p.track.reg.st='done';logA('Dokumen diverifikasi: '+p.name);toast(p.name+' siap diperiksa')}closeM();break}
    case 'verifyNow':{const p=db.patients.find(x=>x.id===v);if(p){p.status='Siap diperiksa';p.track.reg.st='done';p.track.reg.t=nowT();logA('Dokumen diverifikasi: '+p.name);toast('Dokumen diverifikasi')}break}
    case 'svc':{const s=db.services.find(x=>x.id===v);if(s){s.on=!s.on;logA((s.on?'Layanan diaktifkan: ':'Layanan dinonaktifkan: ')+s.n);toast(s.n+(s.on?' diaktifkan':' dinonaktifkan'))}break}
    case 'svcadd':openM(`
      <div><span class="eyebrow">Layanan baru</span><h3 style="margin-top:4px">Tambah layanan</h3></div>
      <label class="fld">Nama layanan<input class="inp" id="sn" placeholder="Contoh: Audiometri lanjutan"></label>
      <label class="fld">Kategori<select class="sel" id="sc"><option>Medex</option><option selected>Penunjang</option></select></label>
      <label class="fld">Deskripsi<textarea class="inp" id="sd" placeholder="Jelaskan singkat untuk pasien"></textarea></label>
      <div class="err" id="serr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="svcsave">Simpan</button></div>`);break;
    case 'svcsave':{const n=$('#sn').value.trim();if(!n){$('#serr').textContent='Nama layanan wajib diisi.';return}db.services.unshift({id:'s'+Date.now(),cat:$('#sc').value,n,d:$('#sd').value.trim()||'Deskripsi belum diisi.',i:'svc',dur:'1 hari',on:false});logA('Layanan baru: '+n);closeM();toast('Layanan ditambahkan (nonaktif)');break}
    case 'usr':{const u=db.users.find(x=>x.id===v);if(u){u.on=!u.on;if(FBON&&fb)fb.updateUser(v,{active:u.on});toast(u.n+(u.on?' bisa masuk':' dinonaktifkan'))}break}
    case 'usradd':if(FBON){toast('Buat akun di Firebase Authentication, lalu atur peran di sini.');return}openM(`
      <div><span class="eyebrow">Undang</span><h3 style="margin-top:4px">Pengguna baru</h3></div>
      <label class="fld">Nama<input class="inp" id="un" placeholder="Nama lengkap"></label>
      <label class="fld">Email<input class="inp" id="ue" type="email" placeholder="nama@klinik.id"></label>
      <label class="fld">Peran<select class="sel" id="ur"><option>Administrator</option><option>Assessor</option></select></label>
      <div class="err" id="uerr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="usrsave">Kirim undangan</button></div>`);break;
    case 'usrsave':{const n=$('#un').value.trim(),e=$('#ue').value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(e)){$('#uerr').textContent='Isi nama dan email yang valid.';return}db.users.push({id:'u'+Date.now(),n,r:$('#ur').value,e,on:false});logA('Undangan dikirim ke '+e);closeM();toast('Undangan dikirim (akses nonaktif sampai diaktifkan)');break}
    case 'copyrep':{const txt='Ringkasan Medex Online: total '+db.patients.length+' pendaftar, menunggu verifikasi '+db.patients.filter(p=>p.status==='Menunggu verifikasi').length+', fit/limitasi '+db.patients.filter(p=>BENEFIT(p)).length+'.';try{navigator.clipboard.writeText(txt).then(()=>toast('Ringkasan disalin'),()=>toast('Salin manual dari tabel'))}catch(e){toast('Salin manual dari tabel')}return}
    case 'pwreset':{if(FBON&&fb){fb.resetPassword(S.role==='patient'?ME.pratama.email:(STAFF[S.role]||{}).email).then(()=>toast('Tautan ubah kata sandi dikirim ke email Anda')).catch(e=>toast('Gagal: '+(e.code||e.message)));return}toast('Mode demo: fitur ini aktif setelah Firebase dihubungkan');return}
    case 'docadd':{const n=($('#dn')||{value:''}).value.trim(),sp=($('#ds')||{value:''}).value.trim(),hr=($('#dh')||{value:''}).value.trim();if(!n){if($('#derr'))$('#derr').textContent='Isi nama dokter.';return}DOCTORS.push({id:'d'+Date.now(),name:n,spec:sp||'Dokter',hours:hr||'Senin–Jumat · 07.30–11.00',skin:'#E8B98F',hair:'short',coat:'#16406F',bg:['#2C86CF','#0B1F3A'],on:true});logA('Dokter ditambahkan: '+n);toast('Dokter ditambahkan');break}
    case 'dtoggle':{const d=DOCTORS.find(x=>x.id===v);if(d){d.on=d.on===false;toast(d.name+(d.on?' ditampilkan':' disembunyikan'))}break}
    case 'close':closeM();return;
    case 'savest':{
      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      if(FINAL.includes(p.status)){toast('Keputusan sudah terbit');break}
      const k=v;
      if(k==='vit'&&(!p.vit.bp||!p.vit.nadi||!p.vit.tb||!p.vit.bb)){toast('Lengkapi tekanan darah, nadi, tinggi, dan berat');break}
      const f=flagOf(p.res||{},k);
      p.track[k]={st:f?'flag':'done',t:nowT()};
      if(p.status==='Siap diperiksa')p.status='Diperiksa';
      logA((f?'Temuan: ':'Selesai: ')+(TRACK.find(s=>s.k===k)||{n:k}).n+' · '+p.name);
      const nextS=WORK.find(s=>p.track[s.k].st!=='done'&&p.track[s.k].st!=='flag'&&p.track[s.k].st!=='na');
      S.stn=nextS?nextS.k:k;
      toast(f?'Tersimpan dengan temuan — tandai tindak lanjut':'Hasil stasiun tersimpan');
      break;
    }
    case 'imgdel':{const p=db.patients.find(x=>x.id===S.sel);if(p&&p.img&&p.img[v]){if(p.img[v].url)URL.revokeObjectURL(p.img[v].url);delete p.img[v];toast('Gambar dihapus')}break}
    case 'addtooth':{const p=db.patients.find(x=>x.id===S.sel);if(p){ensureRes(p);p.res.den.items.push(['Gigi ','Sehat',false]);}break}
    case 'dec':{const p=db.patients.find(x=>x.id===S.sel);if(p&&!FINAL.includes(p.status))p.pend=v;break}
    case 'draft':{const p=db.patients.find(x=>x.id===S.sel);if(p){p.notes=$('#notes').value;toast('Draf disimpan')}return}
    case 'finalask':{
      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      const missing=WORK.filter(s=>!['done','flag','na'].includes(p.track[s.k].st));
      if(missing.length){toast('Belum selesai: '+missing[0].n);S.stn=missing[0].k;break}
      if(!p.vit.bp||!p.vit.nadi||!p.vit.tb||!p.vit.bb){toast('Lengkapi tanda vital terlebih dahulu');return}
      const flagged=TRACK.filter(s=>p.track[s.k].st==='flag');
      if(!FINAL.includes(p.pend)){toast('Pilih satu keputusan');return}
      if(p.pend==='Fit'&&flagged.length){toast('Ada temuan tindak lanjut. Pilih keputusan dengan limitasi atau sementara tidak layak.');return}
      if(p.pend==='Fit with limitation'&&!(($('#lim')||{value:''}).value||'').trim()){toast('Isi limitasi untuk keputusan ini');return}
      openM(`<div><span class="eyebrow">Konfirmasi</span><h3 style="margin-top:4px">Terbitkan keputusan?</h3></div>
        <p class="mu">Keputusan untuk <b>${esc(p.name)}</b> akan terkunci dan tampil di track dan portal pasien.</p>
        <div class="card" style="background:var(--sf2);box-shadow:none">${badge(p.pend)}${p.pend==='Fit with limitation'?`<p class="sm" style="margin-top:8px">Limitasi: ${esc($('#lim').value.trim())}</p>`:''}${flagged.length?`<p class="sm" style="margin-top:8px">Temuan: ${flagged.map(s=>esc(s.n)).join(', ')}</p>`:''}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn btn-am" data-a="finalize">Terbitkan</button></div>`);return}
    case 'finalize':{
      const p=db.patients.find(x=>x.id===S.sel);if(!p)break;
      p.notes=($('#notes')||{value:p.notes}).value;
      p.status=p.pend;p.pend=null;
      if(p.status==='Fit with limitation')p.lim=$('#lim').value.trim();
      else if(p.status==='Fit')p.lim='Tanpa limitasi';
      else p.lim='-';
      p.exp=BENEFIT(p)?addM(TODAY,CLS_MONTHS[p.cls]):'';
      p.assessor=ASSESSOR;
      p.track.ame={st:'done',t:nowT()};p.track.cert={st:'done',t:nowT()};
      logA('Keputusan '+p.status+': '+p.name);
      closeM();toast('Keputusan diterbitkan: '+p.status);S.page='queue';S.sel=null;S.stn=null;break;
    }
    case 'pnav':S.page=v;window.scrollTo(0,0);break;
    case 'stn':{const [pid,k]=v.split('|');const p=db.patients.find(x=>x.id===pid);if(!p)break;openM(stationModal(p,k));$('#mbox').classList.add('wide');return}
    case 'wcls':S.wiz.cls=+v;break;
    case 'wtype':S.wiz.type=v;break;
    case 'wdate':S.wiz.date=v;S.wiz.err='';break;
    case 'wses':S.wiz.ses=v;break;
    case 'wnext':{
      const w=S.wiz;w.err='';
      if(w.step===1){
        if(!w.name.trim()||!w.org.trim()||!w.phone.trim()){w.err='Lengkapi nama, instansi, dan nomor HP.';break}
        if(!/^\S+@\S+\.\S+$/.test(w.email)){w.err='Format email belum benar.';break}
        w.cls=CLS_BY_JOB[w.job]||1;
      }
      if(w.step===3&&!w.date){w.err='Pilih tanggal pemeriksaan.';break}
      if(w.step===4){const docs=DOCS[w.cls];const missing=docs.filter((_,i)=>!(S.upl[w.cls+'-'+i]&&S.upl[w.cls+'-'+i].prog>=100));if(missing.length){w.err='Unggah dokumen yang belum lengkap: '+missing.join(', ')+'.';break}}
      w.step=Math.min(5,w.step+1);break;
    }
    case 'wback':S.wiz.step=Math.max(1,S.wiz.step-1);S.wiz.err='';break;
    case 'wsubmit':{if(FBON&&fb){fbSubmitBooking();break}
      const w=S.wiz;
      if(!w.prep.every(Boolean)||!w.agree){w.err='Centang semua persiapan dan persetujuan untuk mengirim.';break}
      const seq=0;
      const id='LS-'+TODAY.slice(2,4)+TODAY.slice(5,7)+TODAY.slice(8,10)+'-'+String(1000+Math.floor(Math.random()*8999));
      const c=cur()||{};
      const docsN=DOCS[w.cls].filter((_,i)=>S.upl[w.cls+'-'+i]).length;
      db.patients.push(mk({id,owner:OWNER(),name:w.name,job:w.job,org:w.org,cls:w.cls,type:w.type,email:w.email,phone:w.phone,date:w.date,ses:w.ses,status:'Menunggu verifikasi',lic:c.lic||'',docs:docsN,doc:w.doc,time:w.time,svc:w.svc,uploads:uploadsFor(w.cls)}));
      logA('Pendaftaran baru: '+w.name+' ('+id+')');
      w.ok=id;confetti();break;
    }
    case 'afterok':S.wiz=null;S.page='status';break;
    case 'udel':{const f=S.upl[v];if(f&&f.url)URL.revokeObjectURL(f.url);delete S.upl[v];break}
    default:return;
  }
  render();
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('mask')){closeM();return}
  const t=e.target.closest('[data-a]');
  if(!t||t.disabled)return;
  if(t.dataset.a==='svc'&&t.getAttribute('role')==='switch'){act('svc',t);return}
  if(t.dataset.a==='faq'||t.dataset.a==='lf'){act(t.dataset.a,t);return}
  if(t.dataset.a==='stn'){act('stn',t);return}
  act(t.dataset.a,t);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a="dec"]');
  if(!t)return;
  setTimeout(()=>{const w=$('#limw');if(w){const p=db.patients.find(x=>x.id===S.sel);w.style.display=p&&p.pend==='Fit with limitation'?'':'none'}},0);
},true);
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='lform'){
    if(FBON&&fb){fbLogin($('#le').value.trim(),$('#lp').value);return}
    const r=ROLE_CRED[S.login];
    if($('#le').value.trim()!==r.email||$('#lp').value!==r.pass){$('#lerr').textContent='Email atau kata sandi tidak sesuai untuk peran ini.';return}
    S.role=S.login;S.screen='app';S.page=S.role==='patient'?'home':(S.role==='assessor'?'queue':'dashboard');S.sel=null;S.stn=null;S.q='';S.f='Semua';S.pg=1;S.wiz=null;S.liveH=null;if(S.pendingBook&&S.role==='patient'){S.page='book';S.wiz=wizFromPick(S.pendingBook);S.pendingBook=null}
    toast('Selamat datang, '+(S.role==='patient'?ME.pratama.name:staffName(S.role)));
    render();return;
  }
  if(f.id==='sform'){fbSignup($('#gn').value.trim(),$('#ge').value.trim(),$('#gp').value);return}
  if(f.id==='pform'){const fd=new FormData(f);saveProfile(fd);return}
  if(f.id==='sfform'){saveStaff(new FormData(f));return}
  if(f.id==='setf'){const fd=new FormData(f);db.clinic={...db.clinic,name:fd.get('name'),addr:fd.get('addr'),hours:fd.get('hours'),phone:fd.get('phone')};toast('Pengaturan disimpan');return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){const k=keep('q');S.q=t.value;S.pg=1;render();restore('q',k);return}
  if(t.dataset.wf&&S.wiz&&t.dataset.wf!=='agree'){S.wiz[t.dataset.wf]=t.value;return}
  if(t.dataset.path&&S.sel){
    const p=db.patients.find(x=>x.id===S.sel);if(!p)return;
    const root=t.dataset.root==='p'?p:ensureRes(p);
    let val=t.type==='checkbox'?t.checked:t.value;
    if(t.type==='number')val=t.value===''?'':Number(t.value);
    if(t.dataset.path.startsWith('aud.')||t.dataset.path==='psy.score')val=val===''?'':Number(val);
    setAt(root,t.dataset.path,val);
    if(t.dataset.path.startsWith('vit.')){const b=$('#imtOut');if(b)b.textContent=vitImt(p)}
    return;
  }
  if(t.id==='notes'){const p=db.patients.find(x=>x.id===S.sel);if(p)p.notes=t.value;return}
  const pf=t.closest&&t.closest('#pform,#sfform');
  if(pf){const s=pf.querySelector('.pf-state');if(s){s.textContent='Ada perubahan belum disimpan';s.classList.add('dirty')}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.roleUser!==undefined){fbSetRole(t.dataset.roleUser,t.value);return}
  if(t.dataset.quota){const d=t.dataset.quota;db.quota[d]=Math.max(1,+t.value||1);logA('Kuota '+fmt(d)+' diubah ke '+db.quota[d]);render();return}
  if(t.dataset.wf==='job'&&S.wiz){S.wiz.job=t.value;S.wiz.cls=CLS_BY_JOB[t.value]||1;return}
  if(t.dataset.wf==='agree'&&S.wiz){S.wiz.agree=t.checked;return}
  if(t.dataset.prep!==undefined&&S.wiz){S.wiz.prep[+t.dataset.prep]=t.checked;return}
  if(t.dataset.path&&S.sel){const p=db.patients.find(x=>x.id===S.sel);if(p){const root=t.dataset.root==='p'?p:ensureRes(p);setAt(root,t.dataset.path,t.type==='checkbox'?t.checked:t.value);if(t.dataset.path.startsWith('vit.')){const b=$('#imtOut');if(b)b.textContent=vitImt(p)}}return}
  if(t.dataset.img!==undefined&&S.sel){const p=db.patients.find(x=>x.id===S.sel);takeStationImg(p,t.dataset.img,t.files&&t.files[0]);t.value='';return}
  if(t.dataset.upl!==undefined){takeFile(t.dataset.upl,t.files&&t.files[0]);t.value='';return}
  if(t.id==='fIn'){S.filter=t.value}
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  takeFile(z.dataset.drop,e.dataTransfer.files[0]);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('#theme');if(!t)return;
  const root=document.documentElement;
  const cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  root.dataset.theme=cur==='dark'?'light':'dark';
  t.innerHTML=ic(root.dataset.theme==='dark'?'sun':'moon',20);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeM()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('li.clk')){e.preventDefault();e.target.click()}});
/* ---------- FIREBASE LAYER (aktif bila firebase-config.js sudah diisi) ---------- */
const QUSED={};
const ROLE_NAME={patient:'Pasien',assessor:'Assessor',admin:'Administrator'};
const canon=v=>{if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)};
const clean=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
const patientRec=p=>{const r=clean(p);r.res=JSON.stringify(p.res||null);return r};
const patientFromDoc=d=>{const o=Object.assign({},d);if(typeof o.res==='string'){try{o.res=JSON.parse(o.res)}catch(e){o.res=null}}return o};
const fbSafe=n=>String(n).replace(/[^a-zA-Z0-9._-]/g,'_');
const typingNow=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#root')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
const roleSelect=u=>`<select class="sel" style="height:36px;max-width:200px" data-role-user="${esc(u.id)}" aria-label="Peran ${esc(u.n)}">${['patient','assessor','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE_NAME[r]}</option>`).join('')}</select>`;
function fbSetRole(id,role){if(!fb)return;fb.updateUser(id,{role}).then(()=>toast('Peran diperbarui')).catch(e=>toast('Gagal: '+(e.code||e.message)))}
function fbMsg(err){const c=(err&&err.code)||'';if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'Email atau kata sandi tidak sesuai.';if(/email-already-in-use/.test(c))return 'Email sudah terdaftar.';if(/weak-password/.test(c))return 'Kata sandi terlalu lemah (minimal 6 karakter).';if(/network-request-failed/.test(c))return 'Koneksi bermasalah. Coba lagi.';return 'Gagal: '+((err&&err.message)||c)}
function fbLogin(email,pw){const e=$('#lerr');if(e)e.textContent='';fb.signIn(email,pw).catch(err=>{const e2=$('#lerr');if(e2)e2.textContent=fbMsg(err)})}
function fbSignup(name,email,pw){if(!name||!email||pw.length<6){toast('Lengkapi nama, email, dan kata sandi (minimal 6 karakter).');return}fb.signUp(name,email,pw).then(()=>toast('Akun dibuat. Selamat datang!')).catch(err=>toast(fbMsg(err)))}
function uploadsFor(cls){const out={};Object.keys(S.upl).forEach(k=>{const u=S.upl[k];if(k.indexOf(cls+'-')===0&&u&&u.prog>=100)out[k]={name:u.name,size:u.size||0,img:!!u.img,url:u.url||'',path:u.path||''}});return out}
function fbUploadDoc(key,f){
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  if(!uid){toast('Masuk terlebih dahulu');return}
  S.upl[key]={name:f.name,size:f.size,img:f.type.startsWith('image/'),url:'',prog:1};
  render();
  fb.upload('uploads/'+uid+'/'+key+'-'+Date.now()+'-'+fbSafe(f.name),f,pct=>{const el=document.querySelector('[data-prog="'+key+'"]');if(el)el.style.width=pct+'%'})
    .then(r=>{S.upl[key]=Object.assign({},S.upl[key],{url:r.url,path:r.path,prog:100});render();toast('Berkas terunggah: '+f.name)})
    .catch(err=>{delete S.upl[key];render();toast('Upload gagal: '+(err.code||err.message))});
}
function fbUploadStation(p,k,f){
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  toast('Mengunggah gambar…');
  fb.upload('patients/'+p.id+'/img/'+k+'-'+Date.now()+'-'+fbSafe(f.name),f,null).then(r=>{
    if(!p.img)p.img={};
    p.img[k]={name:f.name,url:r.url,path:r.path,pdf:!f.type.startsWith('image/')};
    logA('Gambar terlampir ('+((TRACK.find(s=>s.k===k)||{n:k}).n)+'): '+p.name);
    render();toast('Gambar terlampir: '+f.name);
  }).catch(err=>toast('Upload gagal: '+(err.code||err.message)));
}
function fbSubmitBooking(){
  const w=S.wiz;
  if(!w.prep.every(Boolean)||!w.agree){w.err='Centang semua persiapan dan persetujuan untuk mengirim.';render();return}
  const id='LS-'+TODAY.slice(2,4)+TODAY.slice(5,7)+TODAY.slice(8,10)+'-'+String(1000+Math.floor(Math.random()*8999));
  const c=cur()||{};
  const up=uploadsFor(w.cls);
  const rec=mk({id,owner:uid,name:w.name,job:w.job,org:w.org,cls:w.cls,type:w.type,email:w.email,phone:w.phone,date:w.date,ses:w.ses,status:'Menunggu verifikasi',lic:c.lic||'',docs:Object.keys(up).length,doc:w.doc,time:w.time,svc:w.svc,uploads:up});
  fb.createBooking(w.date,patientRec(rec)).then(()=>{db.patients.push(rec);SYNC.patients[id]=canon(rec);S.wiz.ok=id;logA('Pendaftaran baru: '+w.name+' ('+id+')');confetti();render()})
    .catch(err=>{w.err=/penuh/.test(err.message||'')?'Kuota tanggal ini sudah penuh. Pilih tanggal lain.':'Gagal mengirim: '+(err.code||err.message);render()});
}
function fbOnAuth(user,prof){
  if(!user){uid=null;S.role=null;S.screen='landing';S.pendingBook=null;db.patients.splice(0,db.patients.length);db.users.splice(0,db.users.length);db.log.splice(0,db.log.length);render();return}
  uid=user.uid;
  const role=['patient','assessor','admin'].includes(prof&&prof.role)?prof.role:'patient';
  Object.assign(ME.pratama,{name:(prof&&prof.name)||user.email||'',email:user.email||'',phone:(prof&&prof.phone)||'',job:(prof&&prof.job)||'',org:(prof&&prof.org)||'',dob:(prof&&prof.dob)||'',sex:(prof&&prof.sex)||'',lic:(prof&&prof.lic)||'',address:(prof&&prof.address)||'',emergency:(prof&&prof.emergency)||{name:'',phone:''}});
  if(role!=='patient')Object.assign(STAFF[role],{name:(prof&&prof.name)||user.email||'',email:user.email||'',phone:(prof&&prof.phone)||'',unit:(prof&&prof.unit)||'',jabatan:(prof&&prof.jabatan)||'',gelar:(prof&&prof.gelar)||'',spec:(prof&&prof.spec)||'',ame:(prof&&prof.ame)||'',str:(prof&&prof.str)||'',sip:(prof&&prof.sip)||'',addr:(prof&&prof.addr)||''});
  const changed=S.screen!=='app'||S.role!==role;
  S.role=role;
  if(changed){
    S.screen='app';S.page=role==='patient'?'home':(role==='assessor'?'queue':'dashboard');
    S.sel=null;S.stn=null;S.q='';S.f='Semua';S.pg=1;S.wiz=null;S.liveH=null;
    if(S.pendingBook&&role==='patient'){S.page='book';S.wiz=wizFromPick(S.pendingBook);S.pendingBook=null}
  }
  render();
}
function fbOnCollection(name,list){
  LOADED[name]=true;
  if(name==='patients'){
    const out=list.map(d=>{const o=patientFromDoc(d);o.id=d.id;const loc=db.patients.find(x=>x.id===o.id);if(loc&&SYNC.patients[o.id]!==undefined&&canon(loc)!==SYNC.patients[o.id])return loc;SYNC.patients[o.id]=canon(o);return o});
    db.patients.splice(0,db.patients.length,...out);
    if(!Object.keys(S.upl).length){const c=cur();if(c&&c.uploads)Object.keys(c.uploads).forEach(k=>{S.upl[k]=Object.assign({prog:100},c.uploads[k])})}
  }
  else if(name==='services'){if(list.length){db.services.splice(0,db.services.length,...list);list.forEach(s=>{SYNC.services[s.id]=canon(s)})}}
  else if(name==='doctors'){if(list.length){DOCTORS.splice(0,DOCTORS.length,...list);list.forEach(d=>{SYNC.doctors[d.id]=canon(d)})}}
  else if(name==='quota'){list.forEach(q=>{db.quota[q.id]=q.n;QUSED[q.id]=q.used||0;SYNC.quota[q.id]=q.n})}
  else if(name==='clinic'){if(list.length){const c=Object.assign({},list[0]);delete c.id;db.clinic=c;SYNC.clinic=canon(c)}}
  else if(name==='logs'){db.log.splice(0,db.log.length,...list.map(l=>({t:l.t,x:l.x})))}
  else if(name==='users'){db.users.splice(0,db.users.length,...list.map(u=>({id:u.id,n:u.name||u.email||u.id,r:ROLE_NAME[u.role]||'Pasien',role:u.role||'patient',e:u.email||'',on:u.active!==false})))}
  if(!typingNow())render();
}
function syncWrites(){
  if(!FBON||!fb)return;
  const ops=[];
  if(LOADED.patients){
    db.patients.forEach(p=>{
      if(!p.id)return;
      const now=canon(p),prev=SYNC.patients[p.id];
      if(now===prev)return;
      SYNC.patients[p.id]=now;
      if(prev===undefined){if(p.owner===uid)ops.push({op:'create',col:'patients',id:p.id,data:patientRec(p)});return}
      const a=JSON.parse(prev),b=JSON.parse(now);
      const keys=Object.keys(Object.assign({},a,b)).filter(k=>canon(a[k])!==canon(b[k]));
      if(!keys.length)return;
      const d={};
      keys.forEach(k=>{d[k]=k==='res'?JSON.stringify(p.res||null):(p[k]===undefined?null:clean(p[k]))});
      ops.push({op:'update',col:'patients',id:p.id,data:d});
    });
  }
  if(S.role==='admin'){
    if(LOADED.services)db.services.forEach(s=>{const c=canon(s);if(SYNC.services[s.id]===c)return;SYNC.services[s.id]=c;ops.push({op:'set',col:'services',id:s.id,data:clean(s)})});
    if(LOADED.doctors)DOCTORS.forEach(d=>{const c=canon(d);if(SYNC.doctors[d.id]===c)return;SYNC.doctors[d.id]=c;ops.push({op:'set',col:'doctors',id:d.id,data:clean(d)})});
    if(LOADED.quota)Object.keys(db.quota).forEach(k=>{const n=db.quota[k];if(SYNC.quota[k]===n)return;SYNC.quota[k]=n;ops.push({op:'quota',id:k,data:{n}})});
    if(LOADED.clinic&&db.clinic){const c=canon(db.clinic);if(SYNC.clinic!==c){SYNC.clinic=c;ops.push({op:'set',col:'config',id:'clinic',data:clean(db.clinic)})}}
  }
  if(ops.length)fb.write(ops);
}
async function initFB(){
  if(!FBON)return;
  const tmo=setTimeout(()=>toast('Firebase belum terhubung. Periksa koneksi internet dan firebase-config.js.'),12000);
  db.patients.splice(0,db.patients.length);db.log.splice(0,db.log.length);db.users.splice(0,db.users.length);
  try{
    const mod=await import('./firebase-bridge.js');
    fb=mod.createBridge(CFG,{onAuth:fbOnAuth,onCollection:fbOnCollection,onError:m=>toast(m)});
    clearTimeout(tmo);
    setInterval(syncWrites,1500);
  }catch(e){toast('Firebase belum bisa dimuat: '+(e.message||e))}
}
initFB();
render();
})();
</script>
