<title>Medex Online Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Medex Online: sistem tampilan "lembar klinik". Netral dingin, aksen teal, warna status terpisah dari aksen. */
:root{
  color-scheme:light;
  --bg:#EDF1F3;--sf:#FFFFFF;--sf2:#F5F8FA;--sf3:#E4EBEF;
  --ln:#D3DCE3;--ln2:#BCC9D2;
  --ink:#0F1B24;--ink2:#34474F;--mu:#5B6E7B;--mu2:#8799A5;
  --acc:#0B6B6C;--acc-h:#095859;--acc-ink:#FFFFFF;--acc-soft:#DCEFEE;--acc-line:#9FD3D1;
  --sky:#0B6B6C;--sky2:#CDE8E7;
  --ok:#17794B;--ok2:#DCF1E4;
  --wa:#8A5A0E;--wa2:#FBEFD5;--am:#B7791F;--amink:#1A1206;
  --bd:#B3261E;--bd2:#F8DEDA;
  --info:#1F5FA8;--info2:#DDE9F7;
  --sd:#0B1218;--sdi:#D8E4EC;--sdm:#7F93A1;
  --fd:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rad:6px;
  --sh:0 1px 2px rgba(15,27,36,.06),0 12px 28px -22px rgba(15,27,36,.4);
  --ring:0 0 0 3px rgba(11,107,108,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1117;--sf:#111B23;--sf2:#16232D;--sf3:#1E2E39;
    --ln:#243440;--ln2:#33485A;
    --ink:#E7EFF4;--ink2:#B5C6D1;--mu:#8DA1AE;--mu2:#6C8290;
    --acc:#5CC9C4;--acc-h:#7AD8D3;--acc-ink:#04201F;--acc-soft:#14393A;--acc-line:#2C6B68;
    --sky:#5CC9C4;--sky2:#17393A;
    --ok:#4CC38A;--ok2:#14322A;
    --wa:#E8B25E;--wa2:#37290F;--am:#E0A43A;--amink:#1F1405;
    --bd:#F0857B;--bd2:#3B1E1C;
    --info:#7DB4F0;--info2:#1A2C43;
    --sd:#0A1117;--sdi:#D8E4EC;--sdm:#7F93A1;
    --sh:none;--ring:0 0 0 3px rgba(92,201,196,.32);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1117;--sf:#111B23;--sf2:#16232D;--sf3:#1E2E39;
  --ln:#243440;--ln2:#33485A;
  --ink:#E7EFF4;--ink2:#B5C6D1;--mu:#8DA1AE;--mu2:#6C8290;
  --acc:#5CC9C4;--acc-h:#7AD8D3;--acc-ink:#04201F;--acc-soft:#14393A;--acc-line:#2C6B68;
  --sky:#5CC9C4;--sky2:#17393A;
  --ok:#4CC38A;--ok2:#14322A;
  --wa:#E8B25E;--wa2:#37290F;--am:#E0A43A;--amink:#1F1405;
  --bd:#F0857B;--bd2:#3B1E1C;
  --info:#7DB4F0;--info2:#1A2C43;
  --sd:#0A1117;--sdi:#D8E4EC;--sdm:#7F93A1;
  --sh:none;--ring:0 0 0 3px rgba(92,201,196,.32);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--acc);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px;line-height:1.25}
h3{font-size:16px;line-height:1.35}
p{margin:0}
dl,dd,dt{margin:0}
ol,ul{margin:0;padding:0}
.h-page{font-size:30px;line-height:1.15;margin-top:4px}
.h-sub{font-size:20px;line-height:1.3;margin-top:4px}
.h-id{font:500 20px/1.2 var(--fm);margin-top:4px}
.mu{color:var(--mu)}
.sm{font-size:13px;line-height:1.5}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.eyebrow{display:block;font:600 11.5px/1.3 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.grid{display:grid;gap:16px}
.min0{min-width:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.m-only,.icbtn.m-only{display:none}

/* ---------- kontrol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--ln2);border-radius:var(--rad);background:var(--sf);color:var(--ink);font:600 14px/1 var(--fb);text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--sf2);border-color:var(--mu2)}
.btn:disabled{opacity:.45}
.btn-am{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-am:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--sf3);border-color:transparent;color:var(--ink)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-block{width:100%}
.icbtn{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--ln2);border-radius:var(--rad);background:var(--sf);color:var(--ink2);flex:0 0 auto}
.icbtn:hover{background:var(--sf2);color:var(--ink)}
.chip{height:32px;padding:0 12px;border:1px solid var(--ln2);border-radius:var(--rad);background:var(--sf);color:var(--ink2);font:500 13.5px/1 var(--fb)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:var(--rad);overflow:hidden;background:var(--sf);max-width:100%;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border:0;border-left:1px solid var(--ln2);background:transparent;color:var(--ink2);font:500 13.5px/1 var(--fb)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.45}
.seg-full{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.seg-full button{border-left:0;border-top:0;border-right:1px solid var(--ln2)}
.seg-full button:last-child{border-right:0}
.inp,.sel{width:100%;height:42px;padding:0 12px;border:1px solid var(--ln2);border-radius:var(--rad);background:var(--sf);color:var(--ink);font:400 15px/1.4 var(--fb);transition:border-color .15s,box-shadow .15s;min-width:0}
.inp:focus,.sel:focus{outline:none;border-color:var(--acc);box-shadow:var(--ring)}
.inp[readonly]{background:var(--sf2);color:var(--mu);cursor:default}
.inp[disabled],.sel[disabled]{background:var(--sf2);color:var(--mu2)}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;line-height:1.5;resize:vertical}
.inp.mono{font-family:var(--fm);font-size:14px}
.fld{display:grid;gap:6px;font:600 13px/1.3 var(--fb);color:var(--ink2);min-width:0}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink2);line-height:1.5;min-width:0}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc);flex:0 0 auto}
.err{color:var(--bd);font-size:13.5px}
.err:empty{display:none}
.empty{padding:26px 20px;border:1px dashed var(--ln2);border-radius:8px;color:var(--mu);text-align:center;background:var(--sf)}
.sw{width:42px;height:24px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf3);position:relative;padding:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--sf);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--acc);border-color:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--acc-ink)}

/* ---------- komponen umum ---------- */
.card,.panel{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:20px;min-width:0}
.panel{display:grid;gap:16px;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;font:600 12px/1 var(--fb);white-space:nowrap;vertical-align:middle}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok2);color:var(--ok)}
.t-warn{background:var(--wa2);color:var(--wa)}
.t-bad{background:var(--bd2);color:var(--bd)}
.t-info{background:var(--info2);color:var(--info)}
.t-mute{background:var(--sf3);color:var(--mu)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--ln2);border-radius:4px;font:500 12px/1 var(--fb);color:var(--mu);background:var(--sf);white-space:nowrap}
.tag-am{border-color:var(--am);color:var(--wa)}
.live{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--fb);color:var(--bd)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bd);animation:blink 1.4s ease-in-out infinite}
.bar{height:6px;background:var(--sf3);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .6s ease}
.kvs{display:grid;border-top:1px solid var(--ln)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv span{color:var(--mu);min-width:0}
.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv.flag span,.kv.flag b{color:var(--bd)}
.kvlist{display:grid;border-top:1px solid var(--ln)}
.kvlist>div{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14.5px}
.kvlist dt{color:var(--mu)}
.kvlist dd{font-weight:600;overflow-wrap:anywhere}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11.5px/1.3 var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:11px 14px;border-bottom:1px solid var(--ln);background:var(--sf2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--ln);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sf2)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 0}
.notice{display:grid;gap:6px;padding:14px;border-radius:6px;border:1px solid var(--ln);background:var(--sf2)}
.notice.warn{border-color:var(--am);background:var(--wa2)}
.notice b{color:var(--ink)}
.notice p{font-size:13.5px;color:var(--ink2)}
.todo{list-style:none;display:grid;border-top:1px solid var(--ln)}
.todo li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px;color:var(--ink2)}
.todo li.ok b{color:var(--ok)}
.pf-state{font-size:13px;color:var(--mu);transition:color .2s}
.pf-state.dirty{color:var(--am);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-size:14px;font-weight:500;z-index:60;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mask{position:fixed;inset:0;background:rgba(8,16,22,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:24px;display:grid;gap:16px}
.modal.wide{width:min(960px,100%)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 3.2s ease-in forwards}

/* ---------- beranda publik ---------- */
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.lnav.sc{border-bottom-color:var(--ln)}
.lnav-in{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:600 18px/1.1 var(--fd);color:var(--ink);text-decoration:none;letter-spacing:-.005em;min-width:0}
.mark{width:30px;height:30px;border-radius:6px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:0 0 auto}
.lnks{display:flex;gap:22px;margin-left:8px}
.lnks a{color:var(--ink2);text-decoration:none;font-size:14.5px}
.lnks a:hover{color:var(--ink)}
.lnav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hero{padding:60px 0 56px}
.hero-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.display{font:600 clamp(40px,5.4vw,66px)/1.02 var(--fd);letter-spacing:-.02em;margin-top:16px;text-wrap:balance}
.lead{margin-top:18px;font-size:17px;line-height:1.6;color:var(--ink2);max-width:52ch}
.hcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hjob{display:grid;gap:10px;margin-top:28px;max-width:600px}
.hjob-seg{display:flex;flex-wrap:wrap;width:100%}
.hjob-seg button{flex:1 1 auto;height:auto;min-height:38px;padding:8px 12px;line-height:1.25;text-align:center}
.hres{display:grid;gap:14px;padding:18px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);margin-top:4px}
.hres-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.hres-h b{font:600 24px/1.1 var(--fd)}
.hres-d{display:grid;border-top:1px solid var(--ln)}
.hres-d>div{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}
.hres-d dt{color:var(--mu)}
.hres-d dd{font-weight:600;overflow-wrap:anywhere}
.hres .hcta{margin-top:4px}
.facts{display:flex;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--ln)}
.facts>div{padding-right:28px;margin-right:28px;border-right:1px solid var(--ln)}
.facts>div:last-child{border-right:0;margin-right:0;padding-right:0}
.facts dt{font-size:13px;color:var(--mu)}
.facts dd{margin-top:4px;font:600 28px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.board{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden;box-shadow:var(--sh)}
.board-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px 14px}
.board-t{display:grid;gap:6px;min-width:0}
.board-t b{font:600 18px/1.3 var(--fd);color:var(--ink)}
.board-pct{display:grid;justify-items:end;gap:4px;flex:0 0 auto}
.board-pct b{font:600 32px/1 var(--fd);font-variant-numeric:tabular-nums;color:var(--acc)}
.board-sum{display:grid;gap:8px;padding:0 20px 16px}
.board-bar{height:8px;border-radius:999px;background:var(--sf3);overflow:hidden}
.board-bar i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .6s ease}
.board-cols{display:grid;grid-template-columns:34px minmax(0,1fr) 70px 70px 70px;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);background:var(--sf2);font:600 11.5px/1.2 var(--fb);color:var(--mu)}
.board-cols .bh{display:flex;align-items:center;justify-content:flex-end;gap:5px;white-space:nowrap}
.bdot{display:block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.bdot-run{background:var(--acc)}
.bdot-done{background:var(--ok)}
.bdot-wait{background:var(--ln2)}
.board-l{list-style:none;display:grid}
.board-l li{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 70px 70px 70px;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--ln);transition:background .2s}
.board-l li:last-child{border-bottom:0}
.board-l li:hover{background:var(--sf2)}
.board-l li.is-run{background:var(--acc-soft)}
.board-l li.is-run::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.board-n{display:grid;place-items:center;width:32px;height:28px;border-radius:6px;background:var(--sf3);font:600 12px/1 var(--fm);color:var(--ink2)}
.board-l li.is-run .board-n{background:var(--acc);color:var(--acc-ink)}
.board-m{display:grid;gap:6px;min-width:0}
.board-m b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:600 14.5px/1.3 var(--fb);color:var(--ink);min-width:0;overflow-wrap:anywhere}
.board-live{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:999px;background:var(--sf);color:var(--acc);font:600 11.5px/1 var(--fb);white-space:nowrap}
.board-live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
.board-seg{display:flex;gap:2px;height:5px;border-radius:999px;background:var(--sf3);overflow:hidden}
.board-seg i{display:block;flex:0 0 0;min-width:0;height:100%}
.bs-done{background:var(--ok)}
.bs-run{background:var(--acc)}
.bs-wait{background:var(--ln2)}
.bpl{justify-self:end;display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;padding:0 10px;border-radius:999px;font:600 13px/1 var(--fm);font-variant-numeric:tabular-nums;transition:opacity .2s}
.bpl.z{opacity:.35}
.bpl-run{background:var(--acc-soft);color:var(--acc)}
.bpl-done{background:var(--ok2);color:var(--ok)}
.bpl-wait{background:var(--sf3);color:var(--mu)}
.board-l li.is-run .bpl-run{background:var(--sf)}
.board-now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--ln);background:var(--acc-soft)}
.board-now-n{font:600 30px/1 var(--fd);color:var(--acc)}
.board-now small{display:block;font-size:12.5px}
.board-now b{display:block;font-size:16px;font-weight:600;line-height:1.3}
@media (max-width:560px){
  .board-h{padding:16px 16px 12px}
  .board-sum{padding:0 16px 14px}
  .board-cols,.board-l li{grid-template-columns:30px minmax(0,1fr) 40px 40px 52px;gap:6px;padding-left:12px;padding-right:12px}
  .board-cols .board-lb{display:none}
  .board-n{width:30px;height:26px}
  .bpl{min-width:0;padding:0 8px;font-size:12px}
}
.lamp{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap}
.lamp::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.lamp.done{color:var(--ok)}
.lamp.run{color:var(--acc)}
.lamp.run::before{animation:blink 1.4s ease-in-out infinite}
.lamp.wait{color:var(--mu2)}
.board-f{padding:14px 20px;border-top:1px solid var(--ln);background:var(--sf2);line-height:1.55}
.sec{padding:60px 0;border-top:1px solid var(--ln)}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:24px;align-items:end;margin-bottom:26px}
.sec-h h2{font:600 34px/1.12 var(--fd);margin-top:8px}
.sec-h p{color:var(--mu)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.svc-split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.svc-list{display:grid;align-content:start;border-right:1px solid var(--ln)}
.svc-dot{display:grid;gap:2px;padding:16px 18px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:left;width:100%}
.svc-dot:last-child{border-bottom:0}
.svc-dot:hover{background:var(--sf2)}
.svc-dot.on{background:var(--acc-soft)}
.svc-dot-n{font:600 11px/1.3 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.svc-dot b{font-weight:600;font-size:15px;line-height:1.35}
.svc-dot small{color:var(--mu);font-size:12.5px}
.svc-stage{position:relative;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.svc-g{display:grid;position:relative;min-height:380px}
.svc{grid-area:1/1;display:grid;align-content:start;gap:16px;padding:22px 24px;opacity:0;visibility:hidden;transform:translateY(10px);pointer-events:none;transition:opacity .3s ease,transform .3s ease,visibility 0s linear .3s;cursor:pointer;min-width:0}
.svc.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .45s ease .3s,transform .45s ease .3s,visibility 0s linear 0s}
.svc-art{height:176px;display:grid;place-items:center;border:1px solid var(--ln);border-radius:6px;background:var(--sf2);overflow:hidden}
.svc-art svg{height:100%;width:auto;max-width:100%;display:block}
.svc-tx{display:grid;gap:8px;min-width:0}
.svc h3{font:600 26px/1.15 var(--fd)}
.svc p{color:var(--ink2);max-width:60ch}
.svc-ul{list-style:none;display:grid;gap:4px;color:var(--ink2);font-size:14px}
.svc-ul li{padding-left:14px;position:relative}
.svc-ul li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;background:var(--acc)}
.svc-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.svc-ctl{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--ln)}
.svc-count{margin-left:auto;color:var(--mu);font-size:13px}
.svc-prog{height:2px;background:var(--ln)}
.svc-prog i{display:block;height:100%;width:0;background:var(--acc)}
.stations{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;border-top:1px solid var(--ln)}
.stations li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--ln);align-items:start}
.stations .sn{color:var(--mu);font-size:13px;padding-top:2px}
.stations b{font-weight:600;display:block;line-height:1.35}
.stations small{display:block;color:var(--mu);font-size:13.5px;margin-top:2px;line-height:1.5}
.rate td{vertical-align:top}
.rate small{display:block}
.roster{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
.roster li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);min-width:0}
.roster small{display:block;color:var(--mu);font-size:13.5px}
.doc-av{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:0 0 auto;display:block}
.doc-av svg{width:100%;height:100%;display:block}
.flow{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.flow li{display:grid;gap:6px;align-content:start;padding:18px 20px 0 0;border-top:2px solid var(--ln);min-width:0}
.flow li:first-child{border-top-color:var(--acc)}
.flow-n{font-size:13px;color:var(--acc)}
.flow b{font-weight:600}
.flow small{color:var(--mu);font-size:13.5px;line-height:1.5}
.faq{border-top:1px solid var(--ln)}
.qa{border-bottom:1px solid var(--ln)}
.qa>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border:0;background:transparent;text-align:left;font:600 16px/1.4 var(--fb);color:var(--ink)}
.an{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.qa.open .an{grid-template-rows:1fr}
.an>div{overflow:hidden;min-height:0}
.an p{padding:0 0 18px;color:var(--ink2);max-width:68ch}
.pm{position:relative;width:14px;height:14px;flex:0 0 auto}
.pm::before,.pm::after{content:"";position:absolute;left:0;top:50%;width:14px;height:1.5px;background:currentColor;transition:transform .25s}
.pm::after{transform:rotate(90deg)}
.qa.open .pm::after{transform:rotate(0)}
.cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
.cta h2{font:600 30px/1.15 var(--fd)}
.cta p{color:var(--ink2);margin-top:8px}
.cta .btns{display:flex;gap:10px;flex-wrap:wrap}
.cinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-top:1px solid var(--ln)}
.cinfo>div{display:grid;gap:6px;align-content:start;padding:18px 18px 0 0;min-width:0}
.cinfo>div+div{padding-left:18px;border-left:1px solid var(--ln)}
.cinfo b{font-weight:600}
.lf2{border-top:1px solid var(--ln);padding:28px 0 44px;color:var(--mu);font-size:13px}

/* ---------- masuk ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{display:flex;flex-direction:column;gap:40px;padding:40px 40px 40px max(40px,env(safe-area-inset-left,0px));background:var(--sf);border-right:1px solid var(--ln);min-width:0}
.auth-copy h2{font:600 40px/1.1 var(--fd);max-width:16ch}
.auth-copy p{margin-top:14px;color:var(--ink2);max-width:46ch}
.demo-box{margin-top:auto;display:grid;gap:10px;padding:16px;border:1px solid var(--ln);border-radius:8px;background:var(--sf2)}
.demo{width:100%;font-size:13px}
.demo td{padding:7px 0;border-top:1px solid var(--ln);border-bottom:0;font-size:13px}
.demo td:first-child{font-weight:600;padding-right:12px}
.auth-main{display:grid;place-items:center;padding:40px max(40px,env(safe-area-inset-right,0px)) 40px 40px;min-width:0}
.auth-box{width:100%;max-width:420px;display:grid;gap:18px}
.auth-top{display:flex;justify-content:space-between;align-items:center}
.auth-box>p{color:var(--mu)}

/* ---------- kerangka aplikasi ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--sf);border-right:1px solid var(--ln);min-width:0}
.snav{display:grid;gap:2px;align-content:start}
.snav button{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:0;border-radius:var(--rad);background:transparent;color:var(--ink2);font:500 14.5px/1 var(--fb);text-align:left;white-space:nowrap;transition:background .15s,color .15s}
.snav button:hover{background:var(--sf2);color:var(--ink)}
.snav button[aria-current="page"]{background:var(--acc-soft);color:var(--ink);font-weight:600}
.snav .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:4px;background:var(--bd);color:#fff;font:600 11.5px/20px var(--fm);text-align:center}
.who{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--ln)}
.who b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.who small{color:var(--mu);font-size:12.5px}
.av{width:34px;height:34px;border-radius:6px;background:var(--sf3);color:var(--ink);display:grid;place-items:center;font:600 13px/1 var(--fb);flex:0 0 auto}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:28px max(28px,env(safe-area-inset-right,0px)) 18px max(28px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ln)}
.top-t{min-width:0}
.top h1{margin-top:6px}
.top-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.content{display:grid;gap:20px;align-content:start;width:100%;max-width:1200px;padding:24px max(28px,env(safe-area-inset-right,0px)) 56px max(28px,env(safe-area-inset-left,0px))}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.cols>.stack{gap:20px}
.pt-bot{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ln);border-radius:8px;background:var(--sf);overflow:hidden}
.kpis>div{display:grid;gap:2px;align-content:start;padding:16px 18px;border-right:1px solid var(--ln);min-width:0}
.kpis>div:last-child{border-right:0}
.kpis small{font-size:12.5px;color:var(--mu)}
.kpis b{font:600 30px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.kpis span{font-size:12.5px;color:var(--mu)}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.sec-head{display:grid;gap:4px}
.sec-head+.form-grid{margin-top:4px}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sessions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.ses{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden;min-width:0}
.ses-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--sf2)}
.ses-h b{font-weight:600}
.qlist{display:grid}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:left;width:100%}
.qi:last-child{border-bottom:0}
.qi:hover{background:var(--sf2)}
.qi[aria-current="true"]{background:var(--acc-soft)}
.qi b{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.qi small{color:var(--mu);font-size:12.5px;grid-column:1/-1}
.qi .bar{grid-column:1/-1}
.feed{list-style:none;display:grid}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed time{font:500 12.5px var(--fm);color:var(--mu);white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:220px;padding-top:8px}
.chart .col{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;height:100%;min-width:0}
.chart .track{position:relative;height:100%;background:var(--sf3);border-radius:4px 4px 0 0;overflow:hidden;display:flex;align-items:flex-end}
.chart .cf{width:100%;background:var(--acc);border-radius:4px 4px 0 0;transition:height .6s ease}
.chart .col.full .cf{background:var(--bd)}
.chart .lbl{display:grid;justify-items:center;font-size:12px;color:var(--mu);line-height:1.35;text-align:center}
.chart .lbl b{font:600 12.5px/1.3 var(--fm);color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.brk{display:grid;gap:12px}
.brk-r{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:13.5px}
.brk-r .n{text-align:right;font-weight:600}
.dash-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.dash-cols .wide{grid-column:1/-1}

/* ---------- pasien ---------- */
.progress{display:grid;gap:8px}
.progress .bar{height:8px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
.nd{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font:600 11.5px/1 var(--fm);border:1px solid var(--ln2);background:var(--sf);color:var(--mu);justify-self:start;flex:0 0 auto}
.nd.st-done{background:var(--ok);border-color:var(--ok);color:#fff}
.nd.st-run{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.nd.st-flag{background:var(--bd);border-color:var(--bd);color:#fff}
.nd.st-na{opacity:.35}
.tlist{list-style:none;display:grid;border-top:1px solid var(--ln)}
.ti{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--ln);min-width:0}
.ti.clk{cursor:pointer}
.ti.clk:hover{background:var(--sf2)}
.ti.st-na{opacity:.5}
.ti b{font-weight:600;font-size:14.5px;line-height:1.35;display:block}
.ti small{color:var(--mu);font-size:13px;display:block;margin-top:2px;line-height:1.45}
.tic{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:var(--sf3);color:var(--ink2);flex:0 0 auto}
.ti.st-done .tic{background:var(--ok2);color:var(--ok)}
.ti.st-run .tic{background:var(--acc-soft);color:var(--acc)}
.ti.st-flag .tic{background:var(--bd2);color:var(--bd)}
.ti .tr{display:grid;justify-items:end;gap:4px}
.ti .tr small{margin-top:0}
.stages{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stages li{display:grid;justify-items:start;gap:8px}
.stages small{font:600 12.5px/1.3 var(--fb);color:var(--mu)}
.stages li.done small,.stages li.now small{color:var(--ink)}
.cert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:128px;height:128px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--sf3);stroke-width:9}
.ring .fg{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.ring .lbl b{font:600 34px/1 var(--fd);font-variant-numeric:tabular-nums}
.ring .lbl small{font-size:12px;color:var(--mu)}
.wiz{display:grid;gap:18px}
.wiz-steps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ln)}
.wiz-steps li{display:flex;align-items:center;gap:8px;padding:12px 12px 0 0;color:var(--mu);min-width:0}
.wiz-steps li.on{color:var(--ink);border-top:2px solid var(--acc);margin-top:-2px}
.wiz-steps li.dn{color:var(--ok)}
.wiz-steps small{font:600 13px/1.25 var(--fb);overflow-wrap:anywhere}
.wn{width:24px;height:24px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font-size:12px;background:var(--sf);flex:0 0 auto}
.wiz-steps li.on .wn{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.wiz-steps li.dn .wn{background:var(--ok2);border-color:var(--ok);color:var(--ok)}
.wiz-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:20px;align-items:start}
.wiz-sum{position:sticky;top:20px;display:grid;gap:12px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wgrid .full{grid-column:1/-1}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.copt{display:grid;gap:8px;align-content:start;text-align:left;padding:16px;border:1px solid var(--ln2);border-radius:8px;background:var(--sf)}
.copt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:var(--ring)}
.copt small{color:var(--mu);font-size:13px;line-height:1.5}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dgrid button{display:grid;justify-items:center;gap:2px;padding:12px 6px;border:1px solid var(--ln2);border-radius:8px;background:var(--sf);color:var(--ink)}
.dgrid button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.dgrid button:disabled{opacity:.4;cursor:not-allowed}
.dgrid .wd{font-size:12px;color:var(--mu)}
.dgrid .dn{font:600 24px/1 var(--fd)}
.dgrid .sl{font-size:12px;color:var(--mu)}
.dslot{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);min-width:0}
.thumb{width:76px;height:76px;border-radius:6px;overflow:hidden;background:var(--sf3);display:grid;place-items:center;color:var(--mu)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.drop{display:grid;justify-items:center;gap:6px;padding:26px 18px;border:1px dashed var(--ln2);border-radius:8px;background:var(--sf2);text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop .big{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ln);color:var(--ink2)}
.ubar{height:4px;background:var(--sf3);border-radius:2px;overflow:hidden;margin-top:4px}
.ubar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.prep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;color:var(--ink2);padding:11px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
.prep input{margin-top:4px;accent-color:var(--acc)}
.receipt{display:grid;gap:18px;padding:26px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
.receipt-id{font:600 24px/1.2 var(--fm);letter-spacing:.02em;overflow-wrap:anywhere}
.receipt dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px dashed var(--ln2);padding-top:16px}
.receipt dt{font-size:12.5px;color:var(--mu)}
.receipt dd{font-weight:600;margin-top:2px}
.check-anim{width:64px;height:64px}
.check-anim circle{fill:var(--ok2);stroke:var(--ok);stroke-width:3}
.check-anim path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .2s ease-out forwards}

/* ---------- sheet layanan ---------- */
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheet-t{font:600 30px/1.15 var(--fd);margin-top:6px}
.sheet-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sheet-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,1fr);gap:24px;align-items:start}
.sheet-side{display:grid;gap:14px;align-content:start;padding-left:22px;border-left:1px solid var(--ln)}
.sheet-side .kvlist>div{grid-template-columns:minmax(110px,.9fr) minmax(0,1fr)}
.checks{list-style:none;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;font-size:14.5px;color:var(--ink2)}
.checks li .ic{color:var(--ok);margin-top:4px}
.price{display:grid;gap:4px;padding:14px;border:1px solid var(--ln);border-radius:8px;background:var(--sf2)}
.price b{font:600 26px/1.15 var(--fm);font-variant-numeric:tabular-nums}
.price small{font-size:12.5px;line-height:1.5}
.note{padding:12px 14px;border-left:2px solid var(--am);background:var(--wa2);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--ink2)}
.note b{color:var(--ink)}
.note p{margin-top:4px}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--ln)}
.pick{display:grid;gap:12px;align-content:start}

      ${pk.date&&doc?`<div class="tslots">${TIMES.map(t=>{const tk=docSlotTaken(doc,pk.date,t);return `<button class="tslot" data-a="picktime" data-v="${t}" aria-pressed="${pk.time===t}" ${tk?'disabled':''}>${t}${tk?'<span>penuh</span>':''}</button>`}).join('')}</div>`:`<p class="sm mu">${pk.doc?'Pilih tanggal untuk melihat jam yang tersedia.':'Pilih dokter dan tanggal untuk melihat jam yang tersedia.'}</p>`}

const stnBody=(p,k)=>{

  const pendingNow=(st==='wait'||st==='run')&&k!=='ame'&&k!=='cert';
  if(pendingNow)return `<div class="sim-wrap"><div class="pend"><div class="shim"></div><div class="shim" style="width:70%"></div><div class="shim" style="width:85%"></div></div><p class="mu sm">${st==='run'?'Stasiun sedang berjalan. Hasil tampil saat assessor menyimpannya.':'Belum dimulai. Hasil tampil saat stasiun selesai.'}</p></div>`;
  const R=p.res||{};
  const filled=k==='reg'||k==='vit'||k==='ame'||k==='cert'||(p.res&&(
    k==='hist'?R.hist:k==='fis'?R.fis:k==='eye'?R.eye:k==='ent'?R.aud:k==='ekg'?R.ekg:k==='xr'?R.xr:k==='lab'?R.lab:k==='drug'?R.drug:k==='neu'?R.neu:k==='psy'?R.psy:k==='den'?R.den:null));
  if(!filled)return `<div class="empty">Hasil stasiun ini belum diisi assessor.</div>`;
  const img=imgBlock(p,k);
  let body='';
  if(k==='reg')body=`<div class="kvs">${DOCS[p.cls].map((d,i)=>`<div class="kv${i<p.docs?'':' flag'}"><span>${esc(d)}</span><b>${i<p.docs?'Terunggah':'Belum'}</b></div>`).join('')}</div>`;
  if(k==='vit')body=simTiles({bp:p.vit.bp,nadi:p.vit.nadi,tb:p.vit.tb,bb:p.vit.bb,imt:vitImt(p)})+kv([['Tekanan darah',p.vit.bp],['Nadi',p.vit.nadi+' x/menit'],['Tinggi',p.vit.tb+' cm'],['Berat',p.vit.bb+' kg'],['IMT',vitImt(p)+' kg/m²']]);
  if(k==='hist')body=kv(R.hist.map(h=>[h[0],h[1],h[2]]));
  if(k==='fis')body=simBody(R);
  if(k==='eye')body=simEye(R)+kv([['Visus OD (kanan)',R.eye.visOD,R.eye.visOD!=='6/6'],['Visus OS (kiri)',R.eye.visOS,R.eye.visOS!=='6/6'],['Buta warna (Ishihara)',R.eye.ishihara,false],['Lapang pandang',R.eye.lapang,false],['Phoria',R.eye.phoria,false],['Tekanan bola mata (TIO)',R.eye.tio,false],['Koreksi lensa',R.eye.lensa,R.eye.lensa!=='Tidak diperlukan']]);

  if(k==='ekg')body=simEkg(R)+kv([['Frekuensi jantung',R.ekg.hr+' x/menit',false],['Irama',R.ekg.ritme,false],['Interval PR',R.ekg.pr,false],['Durasi QRS',R.ekg.qrs,false],['Interval QT',R.ekg.qt,false],['Kesan EKG',R.ekg.kesan,!!R.ekg.flag]]);
  if(k==='xr')body=simXr(R);
  if(k==='lab')body=simLab(R)+kv(R.lab.map(l=>[l[0],l[1]+(l[2]?' '+l[2]:'')+' (ref '+l[3]+')',!!l[4]]));
  if(k==='drug')body=simDrug(R)+kv(R.drug.map(d=>[d[0],d[1],false]));
  if(k==='neu')body=R.neu?simEeg(R)+kv([['Kesan EEG',R.neu.kesan,!!R.neu.flag]]):'<div class="empty">Tidak diperlukan.</div>';

  if(k==='den')body=simDen(R)+kv(R.den.items.map(i=>[i[0],i[1],!!i[2]]).concat([['Kesan',R.den.kesan,!!R.den.flag]]));
  if(k==='ame'){const L=limitasiList(p);return kv([['Keputusan AME',p.status,false],['Masa berlaku',p.exp?fmt(p.exp):'—',false],['Assessor',p.assessor||'—',false]])+`<h3 style="font-size:20px;margin-top:6px">Limitasi & temuan</h3>${L.length?kv(L.map(x=>[x[0],x[1],true])):'<div class="kv"><span>Temuan</span><b>Tidak ada temuan tindak lanjut</b></div>'}`}

  return img+body;
};

function trackRail(p){
  const vis=TRACK.filter(s=>p.track[s.k].st!=='na');
  return `<div class="rail" role="list" aria-label="Stasiun pemeriksaan">${vis.map((s,i)=>`<div class="nd st-${p.track[s.k].st}" role="listitem" title="${esc(s.n)}">${p.track[s.k].st==='done'?ic('check',12):(i+1)}</div>`).join('')}</div>`;
}
function trackList(p,clickable){
  const isPast=p.date!==TODAY;
  return `<ol class="tlist">${TRACK.map((s,i)=>{const x=p.track[s.k];const tm=x.st==='na'?'':(x.t||(isPast?fmt(p.date):''));return `<li class="ti st-${x.st}${clickable?' clk':''}" ${clickable?`data-a="stn" data-v="${esc(p.id)}|${s.k}" tabindex="0"`:''}><span class="tic">${ic(s.i,18)}</span><div><b>${esc(s.n)}</b><small>${esc(s.r)}</small></div><div class="tr"><span class="badge ${TCLS[x.st]}">${TLBL[x.st]}</span>${tm?`<small class="mono mu">${esc(tm)}</small>`:''}</div></li>`}).join('')}</ol>`;
}
function progressBlock(a){
  const pct=trackPct(a);
  const nx=TRACK.find(s=>['run','wait'].includes(a.track[s.k].st)&&a.track[s.k].st!=='na');
  return `<div class="progress"><div class="row between sm"><span class="mu">${nx?'Berikutnya: <b style="color:var(--ink)">'+esc(nx.n)+'</b>':'Semua stasiun selesai'}</span><span class="mono">${pct}%</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><span class="sm mu">${trackDone(a)} dari ${trackN(a)} stasiun selesai</span></div>`;
}
function headBlock(a){
  const isToday=a.date===TODAY;
  return `<div class="panel-h"><div><span class="eyebrow">Pemeriksaan ${esc(a.id)}</span><h2 class="h-sub">${isToday?'Hari ini, '+esc(a.time||a.ses):'Dijadwalkan '+fmtL(a.date)}</h2>${a.doc?`<p class="sm mu" style="margin-top:4px">${esc((DOCTORS.find(x=>x.id===a.doc)||{name:''}).name)}${a.svc?' · '+esc(a.svc):''}</p>`:''}</div><div class="row">${isToday?'<span class="live">Berlangsung</span>':''}${badge(a.status)}</div></div>`;
}
function liveCard(a){
  const isToday=a.date===TODAY;
  return `<section class="panel">
    ${headBlock(a)}
    ${progressBlock(a)}
    ${isToday?trackRail(a):'<p class="sm mu">Track aktif pada hari pemeriksaan.</p>'}
    <div class="row between sm"><span class="mu">Klik stasiun untuk melihat hasil dan keterangannya.</span></div>
    <div id="liveTrk">${trackList(a,true)}</div>
  </section>`;
}
function activeHTML(a){
  return `${headBlock(a)}${progressBlock(a)}${a.date===TODAY?trackRail(a):''}<div class="row"><button class="btn btn-sm" data-a="pnav" data-v="status">Buka track lengkap</button></div>`;
}
function certHTML(lf,days){
  const pct=days==null?0:Math.max(0,Math.min(100,days/365*100));
  const R=54,C=2*Math.PI*R;
  return `<div class="cert">
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="${R}"/><circle class="fg" cx="60" cy="60" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="lbl">${days==null?'<b>—</b><small>belum aktif</small>':`<b data-count="${Math.max(0,days)}">0</b><small>hari lagi</small>`}</div></div>
      <div class="stack" style="gap:6px"><h2 class="h-sub">${days==null?'Belum ada sertifikat aktif':'Berlaku sampai '+fmt(lf.exp)}</h2><p class="sm mu">${days==null?'Sertifikat pertama terbit setelah keputusan AME.':esc(lf.lim)+' · Class '+lf.cls+' · '+esc(lf.type)}</p></div>
    </div>`;
}
function pHome(){
  const lf=lastFit(), days=lf?daysTo(lf.exp):null;
  const a=activeOf(), c=cur();
  const docs=DOCS[c?c.cls:1];
  const upl=c&&c.uploads?Object.keys(c.uploads).length:0;
  return `
  <div class="cols">
    <section class="panel">
      ${a?activeHTML(a):`<div class="sec-head"><span class="eyebrow">Pemeriksaan</span><h2>Belum ada pemeriksaan aktif</h2><p class="mu">Daftar medex untuk memulai track. Kuota setiap tanggal ditampilkan saat memilih jadwal.</p></div><div class="row"><button class="btn btn-am" data-a="pnav" data-v="book">Daftar pemeriksaan ${ic('arrow',16)}</button></div>`}
    </section>
    <aside class="stack">
      <section class="panel">
        <span class="eyebrow">Sertifikat</span>
        ${certHTML(lf,days)}
        ${days!=null&&days<=60?`<div class="notice warn"><b>Waktunya perpanjang</b><p>Daftar 2 sampai 4 minggu sebelum sertifikat habis agar ada waktu bila diperlukan pemeriksaan tambahan.</p><div><button class="btn btn-sm" data-a="pnav" data-v="book">Daftar renewal</button></div></div>`:''}
      </section>
      <section class="panel">
        <span class="eyebrow">Yang perlu disiapkan</span>
        <ul class="todo">
          <li class="${upl>=docs.length?'ok':''}"><span>Dokumen pendukung</span><b class="mono">${upl}/${docs.length}</b></li>
          <li><span>Jadwal dan sesi</span><b class="mono">${c?esc(c.time||c.ses):'Belum ada'}</b></li>
          <li><span>Kacamata atau lensa kontak</span><b>Dibawa</b></li>
          <li><span>Daftar obat rutin</span><b>Dibawa</b></li>
        </ul>
        <div class="row"><button class="btn btn-sm" data-a="pnav" data-v="docs">Buka dokumen</button></div>
      </section>
    </aside>
  </div>`;
}

/* daftar */
function wizSummary(w){
  const doc=DOCTORS.find(x=>x.id===w.doc);
  const list=DOCS[w.cls]||[];
  const docsN=list.filter((_,i)=>{const f=S.upl[w.cls+'-'+i];return f&&f.prog>=100}).length;
  const price=MEDEX_PRICE[w.cls+'|'+w.type];
  return `<aside class="panel wiz-sum"><span class="eyebrow">Ringkasan pendaftaran</span>
    <dl class="kvlist">
      <div><dt>Nama</dt><dd>${esc(w.name||'Belum diisi')}</dd></div>
      <div><dt>Kelas</dt><dd>Class ${w.cls} · ${esc(w.type)}</dd></div>
      <div><dt>Tanggal</dt><dd>${w.date?fmtL(w.date):'Belum dipilih'}</dd></div>
      <div><dt>Sesi</dt><dd>${esc(w.time||w.ses)}</dd></div>
      <div><dt>Dokter</dt><dd>${esc(doc?doc.name:'Ditentukan klinik')}</dd></div>
      <div><dt>Dokumen</dt><dd>${docsN} dari ${list.length} terunggah</dd></div>
    </dl>
    <div class="price"><span class="eyebrow">Estimasi biaya</span><b>${fmtRp(price)}</b><small class="mu">Harga contoh untuk demo.</small></div>
  </aside>`;
}
function pBook(){
  if(S.wiz&&S.wiz.ok)return successView(S.wiz.ok);
  const a=activeOf();
  if(a)return `<section class="panel"><div class="panel-h"><div><span class="eyebrow">Pendaftaran aktif</span><h2 class="h-sub">Anda masih punya pemeriksaan yang berjalan</h2></div>${badge(a.status)}</div><p class="mu">${esc(a.id)}. Pendaftaran baru dibuka setelah proses ini selesai.</p><div class="row"><button class="btn" data-a="pnav" data-v="status">Lihat track</button></div></section>`;
  const w=S.wiz||(S.wiz=newWiz());
  const steps=['Data diri','Kelas','Jadwal','Dokumen','Konfirmasi'];
  const head=`<ol class="wiz-steps" aria-label="Langkah pendaftaran">${steps.map((s,i)=>`<li class="${w.step===i+1?'on':(w.step>i+1?'dn':'')}"><span class="wn mono">${w.step>i+1?ic('check',12):i+1}</span><small>${s}</small></li>`).join('')}</ol>`;
  const errBox=`<div class="err" id="werr">${esc(w.err)}</div>`;
  let main='';
  if(w.step===1){
    main=`<div class="sec-head"><span class="eyebrow">Langkah 1 dari 5</span><h2>Data diri</h2><p class="mu sm">Data ini dipakai untuk identitas di sertifikat dan kontak klinik.</p></div>
      <div class="wgrid">
        <label class="fld full">Nama lengkap sesuai lisensi<input class="inp" data-wf="name" value="${esc(w.name)}" autocomplete="name"></label>
        <label class="fld">Pekerjaan<select class="sel" data-wf="job">${Object.keys(CLS_BY_JOB).map(j=>`<option ${w.job===j?'selected':''}>${j}</option>`).join('')}</select></label>
        <label class="fld">Maskapai atau instansi<input class="inp" data-wf="org" value="${esc(w.org)}"></label>
        <label class="fld">No. HP / WhatsApp<input class="inp" data-wf="phone" value="${esc(w.phone)}" type="tel" autocomplete="tel"></label>
        <label class="fld">Email<input class="inp" data-wf="email" value="${esc(w.email)}" type="email" autocomplete="email"></label>
      </div>${errBox}
      <div class="row" style="justify-content:flex-end"><button class="btn btn-am" data-a="wnext">Lanjut ${ic('arrow',16)}</button></div>`;
  }
  if(w.step===2){
    const rec=CLS_BY_JOB[w.job]||1;
    main=`<div class="sec-head"><span class="eyebrow">Langkah 2 dari 5</span><h2>Kelas dan jenis pemeriksaan</h2><p class="mu sm">Sesuai pekerjaan Anda, kelas yang disarankan adalah Class ${rec}. Anda tetap bisa memilih kelas lain.</p></div>
      <div class="cgrid">${[1,2,3].map(k=>`<button class="copt" data-a="wcls" data-v="${k}" aria-pressed="${w.cls===k}"><span class="row between"><b>Class ${k}</b>${k===rec?'<span class="tag tag-am">Disarankan</span>':''}</span><small>${esc(CLS[k].d)}</small></button>`).join('')}</div>
      <div class="stack"><span class="fld">Jenis pemeriksaan</span><div class="seg" role="group" aria-label="Jenis pemeriksaan">${['Initial','Renewal','Special'].map(t=>`<button data-a="wtype" data-v="${t}" aria-pressed="${w.type===t}">${t}</button>`).join('')}</div></div>
      ${errBox}
      <div class="row between"><button class="btn" data-a="wback">${ic('back',16)} Kembali</button><button class="btn btn-am" data-a="wnext">Lanjut ${ic('arrow',16)}</button></div>`;
  }
  if(w.step===3){
    const days=weekdays(1,14);
    main=`<div class="sec-head"><span class="eyebrow">Langkah 3 dari 5</span><h2>Tanggal dan sesi</h2><p class="mu sm">Angka kecil menunjukkan sisa kursi. Tanggal yang sudah penuh tidak bisa dipilih.</p></div>
      <div class="dgrid">${days.map(d=>{const left=quotaOf(d)-countOn(d);return `<button data-a="wdate" data-v="${d}" aria-pressed="${w.date===d}" ${left<=0?'disabled':''}><span class="wd">${wkS(d)}</span><span class="dn">${dnum(d)}</span><span class="mono sm">${monS(d)}</span><span class="sl">${left>0?left+' kursi':'penuh'}</span></button>`}).join('')}</div>
      <div class="stack"><span class="fld">Sesi</span><div class="seg" role="group" aria-label="Sesi">${['Pagi · 07.30','Siang · 10.00'].map(t=>`<button data-a="wses" data-v="${t}" aria-pressed="${w.ses===t}">${t}</button>`).join('')}</div></div>
      ${errBox}
      <div class="row between"><button class="btn" data-a="wback">${ic('back',16)} Kembali</button><button class="btn btn-am" data-a="wnext">Lanjut ${ic('arrow',16)}</button></div>`;
  }
  if(w.step===4){
    const docs=DOCS[w.cls];
    const n=docs.filter((_,i)=>{const f=S.upl[w.cls+'-'+i];return f&&f.prog>=100}).length;
    main=`<div class="row between" style="align-items:flex-end"><div class="sec-head"><span class="eyebrow">Langkah 4 dari 5</span><h2>Unggah dokumen</h2><p class="mu sm">Ambil foto dari kamera ponsel atau pilih berkas. Format JPG, PNG, atau PDF, maksimal 10 MB.</p></div><span class="badge ${n===docs.length?'t-ok':'t-info'}">${n} dari ${docs.length} siap</span></div>
      ${docs.map((d,i)=>slotHTML(w.cls+'-'+i,d)).join('')}
      ${errBox}
      <div class="row between"><button class="btn" data-a="wback">${ic('back',16)} Kembali</button><button class="btn btn-am" data-a="wnext">Lanjut ${ic('arrow',16)}</button></div>`;
  }
  if(w.step===5){
    main=`<div class="sec-head"><span class="eyebrow">Langkah 5 dari 5</span><h2>Konfirmasi</h2><p class="mu sm">Periksa kembali data Anda. Centang persiapan dan persetujuan sebelum mengirim.</p></div>
      <div class="stack">${PREP.map((t,i)=>`<label class="prep"><input type="checkbox" data-prep="${i}" ${w.prep[i]?'checked':''}><span>${t}</span></label>`).join('')}</div>
      <label class="chk"><input type="checkbox" data-wf="agree" ${w.agree?'checked':''}> Data saya benar dan saya setuju pemeriksaan dilakukan sesuai ketentuan.</label>
      ${errBox}
      <div class="row between"><button class="btn" data-a="wback">${ic('back',16)} Kembali</button><button class="btn btn-am" data-a="wsubmit">${ic('check',16)} Kirim pendaftaran</button></div>`;
  }
  return `<div class="wiz">${head}<div class="wiz-grid"><section class="panel">${main}</section>${wizSummary(w)}</div></div>`;
}
function slotHTML(key,label){
  const f=S.upl[key];
  if(f&&f.prog>=100){
    return `<div class="dslot">
      ${f.img?`<div class="thumb"><img src="${f.url}" alt="Pratinjau ${esc(label)}"></div>`:`<div class="thumb">${ic('file',30)}</div>`}
      <div class="stack min0"><div class="row between"><b style="min-width:0;overflow-wrap:anywhere">${esc(label)}</b><span class="badge t-ok">Terunggah</span></div>
        <small class="mono mu" style="overflow-wrap:anywhere">${esc(f.name)} · ${kb(f.size)}</small>
        <div class="row"><label class="btn btn-sm" style="cursor:pointer">${ic('upload',14)} Ganti<input type="file" hidden accept="image/*,application/pdf" capture="environment" data-upl="${key}"></label><button class="btn btn-sm btn-ghost" data-a="udel" data-v="${key}">${ic('trash',14)} Hapus</button></div>
      </div></div>`;
  }
  if(f){
    return `<div class="dslot"><div class="thumb">${ic('upload',26)}</div><div class="stack min0"><b>${esc(label)}</b><small class="mono mu">${esc(f.name)} · mengunggah ${Math.round(f.prog)}%</small><div class="ubar"><i data-prog="${key}" style="width:${f.prog}%"></i></div></div></div>`;
  }
  return `<label class="drop" data-drop="${key}"><span class="big">${ic('camera',20)}</span><b>${esc(label)}</b><small class="mu sm">Ketuk untuk ambil foto atau pilih berkas. Bisa juga diseret ke sini.</small><input type="file" hidden accept="image/*,application/pdf" capture="environment" data-upl="${key}"></label>`;
}

/* track dan status */
function stepper(p){
  const st=stageOf(p.status);
  const labels=['Registrasi','Verifikasi','Pemeriksaan','Evaluasi','Terbit'];
  return `<ol class="stages" aria-label="Tahap proses">${labels.map((l,i)=>{const k=i<st-1||(st===4)?'done':(i===st-1?'now':'');return `<li class="${k}"><span class="nd st-${k==='done'?'done':(k==='now'?'run':'wait')}">${k==='done'?ic('check',12):(i+1)}</span><small>${l}</small></li>`}).join('')}</ol>`;
}
function historyTable(list){
  if(!list.length)return '<div class="empty">Belum ada riwayat pendaftaran.</div>';
  return `<div class="tw"><table><thead><tr><th>Tanggal</th><th>Nomor</th><th>Kelas</th><th>Status</th></tr></thead><tbody>${list.map(p=>`<tr><td class="mono sm">${fmt(p.date)}</td><td class="mono sm">${esc(p.id)}</td><td>Class ${p.cls} · ${esc(p.type)}</td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table></div>`;
}
function pStatus(){
  const c=cur();
  if(!c)return `<div class="empty">Belum ada pendaftaran. Mulai dari menu Daftar.</div>`;
  const finalLetter=FINAL.includes(c.status);
  return `
  ${liveCard(c)}
  <section class="panel"><div class="panel-h"><div><span class="eyebrow">Tahap proses</span><h2 class="h-sub">Nomor ${esc(c.id)}</h2></div>${badge(c.status)}</div>${stepper(c)}</section>
  ${finalLetter?`<section class="panel"><div class="panel-h"><div><span class="eyebrow">Hasil pemeriksaan</span><h2 class="h-sub">Keputusan AME</h2></div><span class="mono sm mu">${fmt(c.date)}</span></div>
    <dl class="kvlist"><div><dt>Keputusan</dt><dd>${badge(c.status)}</dd></div><div><dt>Limitasi</dt><dd>${esc(c.lim)}</dd></div><div><dt>Berlaku sampai</dt><dd class="mono">${c.exp?fmt(c.exp):'—'}</dd></div><div><dt>Assessor</dt><dd>${esc(c.assessor)}</dd></div><div><dt>Catatan</dt><dd>${esc(c.notes||'—')}</dd></div></dl></section>`:''}
  <section class="panel"><div class="panel-h"><div><span class="eyebrow">Riwayat</span><h2 class="h-sub">Semua pendaftaran Anda</h2></div></div>${historyTable(mine().slice().reverse())}</section>`;
}

  return '';
}

function render(){
  const root=$('#root');
  let h='';
  if(S.screen==='landing')h=landing();
  else if(S.screen==='login')h=login();
  else if(S.role==='patient')h=patient();
  else if(S.role==='assessor'){const t=TITLE_STAFF.assessor[S.page]||TITLE_STAFF.assessor.queue;h=shell('assessor',t[1],t[0],assessorPage())}
  else{const t=TITLE_STAFF.admin[S.page]||TITLE_STAFF.admin.dashboard;h=shell('admin',t[1],t[0],adminPage())}
  root.innerHTML=h;
  const tb=$('#theme');if(tb)tb.innerHTML=ic(isDark()?'sun':'moon',18);

  S.liveH=null;

function runAnim(){
  $$('[data-count]').forEach(el=>{
    const end=+el.dataset.count;
    if(RM||!isFinite(end)){el.textContent=el.dataset.count;return}
    let t0=null;const step=t=>{if(t0===null)t0=t;const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
  if(S.screen==='landing'&&$('.svc-g')){slideGo(S.slide);slideTick()}
  if(S.screen==='landing'){const lnav=$('#lnav');const onS=()=>lnav&&lnav.classList.toggle('sc',scrollY>10);onS();window.onscroll=onS}
  else window.onscroll=null;
}

function setAt(root,path,val){
  const parts=path.split('.');let o=root;
  for(let i=0;i<parts.length-1;i++){const key=/^\d+$/.test(parts[i])?+parts[i]:parts[i];if(o[key]==null)o[key]={};o=o[key]}
  const last=parts[parts.length-1];const key=/^\d+$/.test(last)?+last:last;o[key]=val;
}
function takeFile(key,f){
  if(!f)return;
  if(FBON&&fb){fbUploadDoc(key,f);return}
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  const img=f.type.startsWith('image/');
  if(S.upl[key]&&S.upl[key].url)URL.revokeObjectURL(S.upl[key].url);
  S.upl[key]={name:f.name,size:f.size,img,url:img?URL.createObjectURL(f):'',prog:0};
  render();
  let p=0;
  const iv=setInterval(()=>{
    const cu=S.upl[key];if(!cu){clearInterval(iv);return}
    p=Math.min(100,p+10+Math.random()*14);cu.prog=p;
    const el=document.querySelector(`[data-prog="${key}"]`);if(el)el.style.width=p+'%';
    if(p>=100){clearInterval(iv);render();toast('Berkas terunggah: '+f.name)}
  },110);
}
function takeStationImg(p,k,f){
  if(!f)return;
  if(FBON&&fb){fbUploadStation(p,k,f);return}
  if(f.size>10*1024*1024){toast('Berkas terlalu besar (maks 10 MB)');return}
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Pilih foto (JPG/PNG) atau PDF');return}
  if(!p.img)p.img={};
  if(p.img[k]&&p.img[k].url)URL.revokeObjectURL(p.img[k].url);
  p.img[k]={name:f.name,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',pdf:f.type==='application/pdf'};
  logA('Gambar terlampir ('+(TRACK.find(s=>s.k===k)||{n:k}).n+'): '+p.name);
  toast('Gambar terlampir: '+f.name);render();
}
